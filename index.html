<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0e0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Life Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg: #0f0e0c;
    --bg2: #1a1814;
    --bg3: #242018;
    --surface: #2a2520;
    --border: #3a3530;
    --text: #e8e0d0;
    --muted: #8a8070;
    --accent: #d4a843;
    --accent2: #e07a3a;
    --danger: #c0392b;
    --green: #5a9a6a;
    --blue: #4a7fa0;
    --radius: 14px;
    --tab-h: 60px;
    --header-h: 56px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; }

  /* HEADER */
  .header {
    height: var(--header-h);
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
  }
  .header-title {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 18px;
    color: var(--accent);
    letter-spacing: -0.5px;
  }
  .header-title span { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 6px; }
  .settings-btn {
    width: 36px; height: 36px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .settings-btn:hover { color: var(--accent); border-color: var(--accent); }

  /* TABS */
  .tabs {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: var(--tab-h);
    background: var(--bg2);
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    z-index: 100;
  }
  .tab-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Syne', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    transition: color 0.2s;
    position: relative;
  }
  .tab-btn.active { color: var(--accent); }
  .tab-btn .tab-icon { font-size: 20px; }
  .tab-btn::after {
    content: '';
    position: absolute;
    bottom: 0; left: 20%; right: 20%;
    height: 2px;
    background: var(--accent);
    border-radius: 2px 2px 0 0;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .tab-btn.active::after { opacity: 1; }

  /* PAGES */
  .page {
    position: fixed;
    top: var(--header-h); left: 0; right: 0;
    bottom: var(--tab-h);
    overflow-y: auto;
    overflow-x: hidden;
    display: none;
    -webkit-overflow-scrolling: touch;
  }
  .page.active { display: block; }

  /* ===== LOG PAGE ===== */
  .shortcuts-bar {
    padding: 10px 12px 6px;
    display: flex;
    gap: 6px;
    flex-wrap: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .shortcuts-bar::-webkit-scrollbar { display: none; }
  .shortcut-chip {
    flex-shrink: 0;
    padding: 5px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .shortcut-chip:active { background: var(--accent); color: var(--bg); border-color: var(--accent); transform: scale(0.95); }
  .shortcut-add-btn {
    flex-shrink: 0;
    width: 30px; height: 28px;
    background: none;
    border: 1px dashed var(--border);
    border-radius: 20px;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  /* LOG FEED */
  .log-feed {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 200px;
  }
  .log-entry {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    position: relative;
  }
  .log-entry.sleep-entry { border-left: 3px solid var(--blue); }
  .log-entry.expense-entry { border-left: 3px solid var(--green); }
  .log-entry-time {
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 4px;
    font-family: 'DM Mono', monospace;
  }
  .log-entry-text {
    font-size: 13px;
    line-height: 1.5;
    color: var(--text);
  }
  .log-entry-tag {
    display: inline-block;
    margin-top: 5px;
    padding: 2px 7px;
    border-radius: 10px;
    font-size: 10px;
    background: var(--surface);
    color: var(--muted);
  }
  .log-entry-delete {
    position: absolute;
    top: 8px; right: 8px;
    background: none;
    border: none;
    color: var(--border);
    font-size: 14px;
    cursor: pointer;
    padding: 2px 5px;
  }
  .log-entry-delete:active { color: var(--danger); }
  .calc-badge {
    margin-top: 5px;
    display: inline-block;
    padding: 2px 8px;
    border-radius: 8px;
    font-size: 11px;
    background: rgba(74, 127, 160, 0.2);
    color: var(--blue);
    font-family: 'DM Mono', monospace;
  }

  /* DATE SEPARATOR */
  .date-sep {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    padding: 8px 0 4px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* INPUT AREA */
  .input-area {
    position: sticky;
    bottom: 0;
    background: var(--bg);
    border-top: 1px solid var(--border);
    padding: 10px 12px;
  }
  .input-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  .log-input {
    flex: 1;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    resize: none;
    outline: none;
    min-height: 42px;
    max-height: 120px;
    overflow-y: auto;
    transition: border-color 0.2s;
    line-height: 1.4;
  }
  .log-input:focus { border-color: var(--accent); }
  .log-input::placeholder { color: var(--muted); }
  .send-btn {
    width: 42px; height: 42px;
    background: var(--accent);
    border: none;
    border-radius: 12px;
    color: var(--bg);
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .send-btn:active { transform: scale(0.92); background: var(--accent2); }

  /* MOOD PICKER */
  .mood-row {
    display: flex;
    gap: 6px;
    margin-bottom: 7px;
    align-items: center;
  }
  .mood-label { font-size: 10px; color: var(--muted); margin-right: 2px; }
  .mood-btn {
    width: 28px; height: 28px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .mood-btn.selected { border-color: var(--accent); background: rgba(212, 168, 67, 0.15); }

  /* ===== EXPENSE PAGE ===== */
  .expense-summary {
    margin: 12px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .exp-stat { text-align: center; }
  .exp-stat-val {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 800;
    color: var(--accent);
  }
  .exp-stat-label { font-size: 10px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
  .expense-list { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 8px; }
  .expense-item {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .expense-item-left { flex: 1; }
  .expense-item-desc { font-size: 13px; color: var(--text); }
  .expense-item-date { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .expense-item-amount {
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--accent2);
  }
  .expense-item-cat {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 8px;
    background: var(--surface);
    color: var(--muted);
    margin-top: 3px;
    display: inline-block;
  }
  .section-header {
    padding: 12px 12px 6px;
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.8;
  }
  .empty-state .empty-icon { font-size: 40px; margin-bottom: 10px; }

  /* ===== MISTAKE PAGE ===== */
  .mistake-input-area {
    padding: 12px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .mistake-textarea {
    width: 100%;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    color: var(--text);
    font-family: 'Instrument Serif', serif;
    font-size: 15px;
    resize: none;
    outline: none;
    min-height: 80px;
    line-height: 1.6;
    transition: border-color 0.2s;
  }
  .mistake-textarea:focus { border-color: var(--danger); }
  .mistake-textarea::placeholder { color: var(--muted); font-style: italic; }
  .mistake-add-btn {
    margin-top: 8px;
    width: 100%;
    padding: 10px;
    background: rgba(192, 57, 43, 0.15);
    border: 1px solid rgba(192, 57, 43, 0.3);
    border-radius: var(--radius);
    color: var(--danger);
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: all 0.15s;
  }
  .mistake-add-btn:active { background: rgba(192, 57, 43, 0.3); transform: scale(0.98); }
  .mistake-list { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .mistake-item {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--danger);
    border-radius: var(--radius);
    padding: 12px 14px;
    position: relative;
  }
  .mistake-item-date { font-size: 10px; color: var(--muted); margin-bottom: 5px; font-family: 'DM Mono', monospace; }
  .mistake-item-text { font-family: 'Instrument Serif', serif; font-size: 14px; line-height: 1.6; color: var(--text); }
  .mistake-del-btn {
    position: absolute; top: 8px; right: 8px;
    background: none; border: none; color: var(--border); font-size: 14px; cursor: pointer; padding: 3px 6px;
  }
  .mistake-del-btn:active { color: var(--danger); }

  /* ===== ANALYSIS PAGE ===== */
  .analysis-controls {
    padding: 12px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
  }
  .date-range-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 10px;
  }
  .date-input-wrap label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: block;
    margin-bottom: 4px;
  }
  .date-input-wrap input[type="date"] {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    outline: none;
  }
  .date-input-wrap input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.7); }
  .analyze-btn {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    color: var(--bg);
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: all 0.15s;
  }
  .analyze-btn:active { transform: scale(0.98); background: var(--accent2); }
  .analyze-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .analysis-result {
    padding: 12px;
    white-space: pre-wrap;
    font-size: 13px;
    line-height: 1.8;
    color: var(--text);
    font-family: 'DM Mono', monospace;
  }
  .analysis-result h3 {
    font-family: 'Syne', sans-serif;
    color: var(--accent);
    font-size: 15px;
    margin: 14px 0 6px;
  }
  .analysis-result strong { color: var(--accent2); font-weight: 500; }
  .chart-wrap {
    margin: 12px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
  }
  .chart-wrap h4 {
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }
  .download-row {
    padding: 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .dl-btn {
    padding: 12px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    transition: all 0.15s;
  }
  .dl-btn span:first-child { font-size: 20px; }
  .dl-btn:active { background: var(--accent); color: var(--bg); border-color: var(--accent); transform: scale(0.97); }
  .loading-dots {
    display: inline-flex;
    gap: 4px;
    align-items: center;
  }
  .loading-dots span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: dot-bounce 1.2s infinite;
  }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dot-bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-6px); opacity: 1; }
  }

  /* ===== SETTINGS MODAL ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 999;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-sheet {
    background: var(--bg2);
    border-radius: 20px 20px 0 0;
    border: 1px solid var(--border);
    border-bottom: none;
    width: 100%;
    max-width: 500px;
    padding: 20px;
    max-height: 85vh;
    overflow-y: auto;
    animation: slide-up 0.3s ease;
  }
  @keyframes slide-up {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal-handle {
    width: 40px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 16px;
  }
  .modal-title {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 16px;
  }
  .field-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    margin-top: 14px;
    display: block;
  }
  .field-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    outline: none;
  }
  .field-input:focus { border-color: var(--accent); }
  .save-settings-btn {
    margin-top: 16px;
    width: 100%;
    padding: 12px;
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    color: var(--bg);
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
  }
  .shortcut-manage-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .shortcut-manage-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: var(--surface);
    border-radius: 10px;
    font-size: 13px;
  }
  .shortcut-remove-btn {
    background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer;
  }
  .shortcut-remove-btn:active { color: var(--danger); }

  /* TOAST */
  .toast {
    position: fixed;
    top: calc(var(--header-h) + 10px);
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--accent);
    color: var(--bg);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    opacity: 0;
    transition: all 0.3s;
    z-index: 9999;
    white-space: nowrap;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* TIMELINE PAGE */
  .timeline-date-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .tl-date-label {
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 800;
    color: var(--text);
  }
  .tl-nav-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    padding: 5px 12px;
    font-size: 16px;
    cursor: pointer;
  }
  .timeline-wrap {
    padding: 12px;
    position: relative;
  }
  .tl-hour-row {
    display: flex;
    align-items: flex-start;
    min-height: 44px;
    position: relative;
  }
  .tl-hour-label {
    width: 46px;
    flex-shrink: 0;
    font-size: 10px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    padding-top: 4px;
    text-align: right;
    padding-right: 10px;
  }
  .tl-hour-line {
    flex: 1;
    border-top: 1px solid var(--border);
    padding-top: 4px;
    min-height: 40px;
    position: relative;
  }
  .tl-block {
    border-radius: 6px;
    padding: 3px 8px;
    font-size: 11px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    margin-bottom: 3px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #fff;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
  }
  .tl-block-time { font-size: 9px; opacity: 0.8; flex-shrink: 0; margin-left: 6px; }
  .tl-now-line {
    position: absolute;
    left: 46px; right: 0;
    height: 2px;
    background: var(--danger);
    z-index: 5;
  }
  .tl-now-dot {
    width: 8px; height: 8px;
    background: var(--danger);
    border-radius: 50%;
    position: absolute;
    left: 42px;
    margin-top: -3px;
    z-index: 5;
  }
  .tl-empty { text-align: center; padding: 20px; color: var(--muted); font-size: 12px; }
  .tl-pending-block {
    margin: 8px 12px;
    background: var(--bg2);
    border: 1px dashed var(--accent);
    border-radius: var(--radius);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .tl-pending-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.5s infinite;
    flex-shrink: 0;
  }
  @keyframes pulse {

  /* SCROLLBAR */

    </div>

<script>
// ============ STATE ============
let state = {
  logs: [],
  expenses: [],
  mistakes: [],
  shortcuts: ['chai ☕', 'gym 💪', 'study 📚', 'trading 📈', 'walk 🚶'],
  apiKey: '',
  userName: '',
  selectedMood: ''
};

// ============ INIT ============
function init() {
  const saved = localStorage.getItem('lifetracker_v2');
  if (saved) state = { ...state, ...JSON.parse(saved) };

  // Set header date
  document.getElementById('currentDate').textContent = ' · ' + new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });

  // Set default date range
  const today = new Date().toISOString().split('T')[0];
  const week = new Date(Date.now() - 7 * 86400000).toISOString().split('T')[0];
  document.getElementById('dateFrom').value = week;
  document.getElementById('dateTo').value = today;

  renderShortcuts();
  renderLogFeed();
  renderExpense();
  renderMistakes();
  renderStreak();
  initCharts();
}

// ============ SAVE ============
function save() {
  localStorage.setItem('lifetracker_v2', JSON.stringify(state));
}

// ============ TABS ============
function switchTab(name, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  btn.classList.add('active');
  if (name === 'analysis') initCharts();
  if (name === 'timeline') renderTimeline();
}

// ============ MOOD ============
function selectMood(btn) {
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  state.selectedMood = btn.dataset.mood;
}

// ============ SHORTCUTS ============
function renderShortcuts() {
  const bar = document.getElementById('shortcutsBar');
  bar.innerHTML = '';
  state.shortcuts.forEach(s => {
    const chip = document.createElement('button');
    chip.className = 'shortcut-chip';
    chip.textContent = s;
    chip.onclick = () => useShortcut(s);
    bar.appendChild(chip);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'shortcut-add-btn';
  addBtn.textContent = '+';
  addBtn.onclick = openSettings;
  bar.appendChild(addBtn);
}

function useShortcut(text) {
  const inp = document.getElementById('logInput');
  inp.value = text;
  inp.focus();
}

function addShortcut() {
  const val = document.getElementById('newShortcutInput').value.trim();
  if (!val) return;
  state.shortcuts.push(val);
  document.getElementById('newShortcutInput').value = '';
  save();
  renderShortcuts();
  renderShortcutManage();
  showToast('Shortcut add ho gaya! ✅');
}

function removeShortcut(idx) {
  state.shortcuts.splice(idx, 1);
  save();
  renderShortcuts();
  renderShortcutManage();
}

function renderShortcutManage() {
  const list = document.getElementById('shortcutManageList');
  list.innerHTML = '';
  state.shortcuts.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'shortcut-manage-item';
    div.innerHTML = `<span>${s}</span><button class="shortcut-remove-btn" onclick="removeShortcut(${i})">✕</button>`;
    list.appendChild(div);
  });
}

// ============ SMART ACTIVITY DETECTION ============
const START_WORDS = ['start','starting','started','begin','beginning','shuru','chalu','open','opening','laga','kar raha','starting now'];
const END_WORDS = ['end','ended','ending','stop','stopped','finish','finished','done','complete','completed','khatam','band','over','ho gaya','kar liya','khatm'];

function extractActivity(text) {
  let activity = text.toLowerCase().trim();
  [...START_WORDS, ...END_WORDS].forEach(w => {
    activity = activity.replace(new RegExp('\\b' + w + '\\b', 'g'), '');
  });
  return activity.replace(/\s+/g, ' ').trim();
}

function isStartEvent(text) {
  const lower = text.toLowerCase();
  return START_WORDS.some(w => lower.includes(w));
}

function isEndEvent(text) {
  const lower = text.toLowerCase();
  return END_WORDS.some(w => lower.includes(w));
}

function activitySimilarity(a, b) {
  if (!a || !b) return false;
  const wordsA = a.split(' ').filter(w => w.length > 2);
  const wordsB = b.split(' ').filter(w => w.length > 2);
  if (!wordsA.length || !wordsB.length) return false;
  return wordsA.some(wa => wordsB.some(wb => wa.includes(wb) || wb.includes(wa)));
}

function findMatchingStart(activity, beforeTime) {
  return state.logs.find(l => {
    if (new Date(l.time) >= beforeTime) return false;
    if (!l.isStart || l.matched) return false;
    return activitySimilarity(l.activity, activity);
  });
}

function formatDuration(ms) {
  if (ms < 0) return null;
  const totalMins = Math.floor(ms / 60000);
  const hours = Math.floor(totalMins / 60);
  const mins = totalMins % 60;
  return hours > 0 ? `${hours}h ${mins}m` : `${mins}m`;
}

// ============ LOG (AI POWERED) ============
async function addLog() {
  const inp = document.getElementById('logInput');
  const text = inp.value.trim();
  if (!text) return;

  const sendBtn = document.querySelector('.send-btn');
  sendBtn.textContent = '⏳';
  sendBtn.disabled = true;
  inp.value = '';
  inp.style.height = 'auto';

  const now = new Date();

  // Build context of pending activities for AI
  const pending = state.logs.filter(l => l.isStart && !l.matched);
  const pendingStr = pending.length > 0
    ? pending.map(l => `"${l.activity}" started at ${new Date(l.time).toLocaleTimeString('en-IN', {hour:'2-digit',minute:'2-digit',hour12:true})}`).join(', ')
    : 'none';

  let parsed = null;

  if (state.apiKey) {
    try {
      const prompt = `You are a life tracking assistant. Parse this log entry and return ONLY a JSON object, no explanation.

User wrote: "${text}"
Currently running activities: ${pendingStr}
Current time: ${now.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit', hour12:true})}

Return JSON with these fields:
- type: "activity_start" | "activity_end" | "expense" | "note"
- activity: clean activity name in English (e.g. "studying", "sleeping", "gym", "walk") - null if not activity
- amount: number if expense, null otherwise
- category: "🍔 Food" | "🚗 Travel" | "📚 Study" | "💊 Health" | "📦 Other" - only if expense
- display: short clean display text (2-3 words max, capitalize first letter)

Examples:
"start studying" → {"type":"activity_start","activity":"studying","amount":null,"category":null,"display":"Studying"}
"padhai shuru ki" → {"type":"activity_start","activity":"studying","amount":null,"category":null,"display":"Studying"}
"study khatam" → {"type":"activity_end","activity":"studying","amount":null,"category":null,"display":"Studying"}
"so gaya" → {"type":"activity_start","activity":"sleeping","amount":null,"category":null,"display":"Sleeping"}
"uth gaya" → {"type":"activity_end","activity":"sleeping","amount":null,"category":null,"display":"Sleeping"}
"120 rs chai pe kharch hua" → {"type":"expense","activity":null,"amount":120,"category":"🍔 Food","display":"Chai expense"}
"went for a walk" → {"type":"activity_start","activity":"walk","amount":null,"category":null,"display":"Walk"}
"had lunch at dominos 250 rs" → {"type":"expense","activity":null,"amount":250,"category":"🍔 Food","display":"Lunch - Dominos"}`;

      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': state.apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true'
        },
        body: JSON.stringify({
          model: 'claude-haiku-4-5-20251001',
          max_tokens: 200,
          messages: [{ role: 'user', content: prompt }]
        })
      });

      const data = await res.json();
      const raw = data.content?.[0]?.text || '';
      const jsonMatch = raw.match(/\{[\s\S]*\}/);
      if (jsonMatch) parsed = JSON.parse(jsonMatch[0]);
    } catch(e) {
      console.error('AI parse error:', e);
    }
  }

  // Fallback if no API or parse failed
  if (!parsed) {
    const isS = isStartEvent(text);
    const isE = isEndEvent(text);
    const act = extractActivity(text);
    const expMatch = text.match(/(?:₹|rs\.?|rupees?|kharch|spend|spent|paid|diya)\s*(\d+(?:\.\d+)?)|(\d+(?:\.\d+)?)\s*(?:₹|rs\.?|rupees?|kharch|spend|spent|paid|ka|ki)/i);
    const amt = expMatch ? parseFloat(expMatch[1] || expMatch[2]) : null;
    parsed = {
      type: amt ? 'expense' : isS && !isE ? 'activity_start' : isE ? 'activity_end' : 'note',
      activity: act || null,
      amount: amt,
      category: detectCategory(text),
      display: text.slice(0,30)
    };
  }

  // Build entry
  const entry = {
    id: Date.now(),
    text: text,
    time: now.toISOString(),
    mood: state.selectedMood || '',
    type: 'log',
    isStart: false,
    isEnd: false,
    activity: parsed.activity || '',
    matched: false,
    duration: null,
    display: parsed.display || text
  };

  if (parsed.type === 'activity_start') {
    entry.type = 'activity-start';
    entry.isStart = true;
  } else if (parsed.type === 'activity_end') {
    entry.type = 'activity-end';
    entry.isEnd = true;
    // Find matching start
    const matchedStart = state.logs.find(l =>
      l.isStart && !l.matched &&
      l.activity && parsed.activity &&
      (l.activity.toLowerCase().includes(parsed.activity.toLowerCase()) ||
       parsed.activity.toLowerCase().includes(l.activity.toLowerCase()) ||
       activitySimilarity(l.activity, parsed.activity))
    );
    if (matchedStart) {
      const diff = now - new Date(matchedStart.time);
      entry.duration = formatDuration(diff);
      entry.matchedActivity = matchedStart.display || matchedStart.activity;
      const si = state.logs.findIndex(l => l.id === matchedStart.id);
      if (si !== -1) state.logs[si].matched = true;
    }
  } else if (parsed.type === 'expense' && parsed.amount > 0) {
    entry.type = 'expense';
    state.expenses.unshift({
      id: entry.id,
      text,
      amount: parsed.amount,
      time: now.toISOString(),
      category: parsed.category || detectCategory(text)
    });
  }

  state.logs.unshift(entry);
  save();

  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
  state.selectedMood = '';
  sendBtn.textContent = '↑';
  sendBtn.disabled = false;
  renderLogFeed();
  renderExpense();
  renderStreak();
  showToast('Logged! ✅');
}

function detectCategory(text) {
  const t = text.toLowerCase();
  if (t.match(/food|khana|pizza|burger|chai|coffee|restaurant|bhojan|lunch|dinner|breakfast/)) return '🍔 Food';
  if (t.match(/auto|uber|ola|petrol|bus|train|travel|yatra/)) return '🚗 Travel';
  if (t.match(/book|course|study|padhai/)) return '📚 Study';
  if (t.match(/medicine|dawai|doctor|hospital/)) return '💊 Health';
  return '📦 Other';
}

function deleteLog(id) {
  if (!confirm('Ye log delete karna hai?')) return;
  state.logs = state.logs.filter(l => l.id !== id);
  state.expenses = state.expenses.filter(e => e.id !== id);
  save();
  renderLogFeed();
  renderExpense();
}

function renderLogFeed() {
  const feed = document.getElementById('logFeed');
  if (state.logs.length === 0) {
    feed.innerHTML = `<div class="empty-state"><div class="empty-icon">📝</div>Koi log nahi abhi<br>Kuch bhi likho neeche...</div>`;
    return;
  }

  // Build combined display list
  const displayEntries = [];
  const usedIds = new Set();

  // Process in chronological order for matching, display in reverse
  const sorted = [...state.logs].sort((a, b) => new Date(a.time) - new Date(b.time));

  sorted.forEach(e => {
    if (usedIds.has(e.id)) return;
    if (e.type === 'activity-end') {
      const matchStart = sorted.find(l =>
        !usedIds.has(l.id) && l.isStart && l.activity &&
        activitySimilarity(l.activity, e.activity) &&
        new Date(l.time) <= new Date(e.time)
      );
      if (matchStart) {
        usedIds.add(matchStart.id);
        usedIds.add(e.id);
        displayEntries.push({ type: 'combined', start: matchStart, end: e, sortTime: e.time });
      } else {
        usedIds.add(e.id);
        displayEntries.push({ type: 'single', entry: e, sortTime: e.time });
      }
    } else if (e.type === 'activity-start') {
      usedIds.add(e.id);
      if (!e.matched) {
        displayEntries.push({ type: 'pending', entry: e, sortTime: e.time });
      }
    } else {
      usedIds.add(e.id);
      displayEntries.push({ type: 'single', entry: e, sortTime: e.time });
    }
  });

  // Sort newest first
  displayEntries.sort((a, b) => new Date(b.sortTime) - new Date(a.sortTime));

  // Group by date
  const grouped = {};
  displayEntries.forEach(d => {
    const dateKey = new Date(d.sortTime).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    if (!grouped[dateKey]) grouped[dateKey] = [];
    grouped[dateKey].push(d);
  });

  let html = '';
  Object.entries(grouped).forEach(([date, items]) => {
    html += `<div class="date-sep">${date}</div>`;
    items.forEach(item => {
      if (item.type === 'combined') {
        const { start, end } = item;
        const startT = new Date(start.time).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
        const endT = new Date(end.time).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
        const actLabel = (end.matchedActivity || end.display || end.activity || start.display || start.activity || '').replace(/\b\w/g, c => c.toUpperCase());
        html += `<div class="log-entry" style="border-left:3px solid var(--accent);">
          <button class="log-entry-delete" onclick="deleteCombined(${start.id},${end.id})">🗑</button>
          <div class="log-entry-time">${startT} → ${endT}</div>
          <div class="log-entry-text" style="font-family:'Syne',sans-serif;font-weight:700;font-size:15px;">${actLabel}</div>
          <div class="calc-badge">⏱ ${end.duration || '0m'}</div>
          ${end.mood ? `<span class="log-entry-tag">${end.mood}</span>` : ''}
        </div>`;
      } else if (item.type === 'pending') {
        const t = new Date(item.entry.time).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
        const actLabel = (item.entry.activity || item.entry.text || '').replace(/\b\w/g, c => c.toUpperCase());
        html += `<div class="log-entry" style="border-left:3px solid var(--green);">
          <button class="log-entry-delete" onclick="deleteLog(${item.entry.id})">🗑</button>
          <div class="log-entry-time">${t} → abhi tak</div>
          <div class="log-entry-text" style="font-family:'Syne',sans-serif;font-weight:700;font-size:15px;">${actLabel}</div>
          <div class="calc-badge" style="background:rgba(90,154,106,0.2);color:var(--green)">⏳ Chal raha hai...</div>
        </div>`;
      } else {
        const e = item.entry;
        const t = new Date(e.time).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
        const border = e.type === 'expense' ? 'border-left:3px solid var(--accent2);' : '';
        html += `<div class="log-entry" style="${border}">
          <button class="log-entry-delete" onclick="deleteLog(${e.id})">🗑</button>
          <div class="log-entry-time">${t}</div>
          <div class="log-entry-text">${e.text}</div>
          ${e.mood ? `<span class="log-entry-tag">${e.mood}</span>` : ''}
        </div>`;
      }
    });
  });

  feed.innerHTML = html || `<div class="empty-state"><div class="empty-icon">📝</div>Koi log nahi</div>`;
}

function deleteCombined(startId, endId) {
  if (!confirm('Ye activity delete karna hai?')) return;
  state.logs = state.logs.filter(l => l.id !== startId && l.id !== endId);
  save();
  renderLogFeed();
  renderTimeline();
}

// ============ TIMELINE ============
const ACTIVITY_COLORS = [
  '#d4a843','#e07a3a','#4a7fa0','#5a9a6a','#9a5a9a','#c0392b','#2980b9','#27ae60','#e74c3c','#8e44ad'
];
let tlDate = new Date();
tlDate.setHours(0,0,0,0);
const tlColorMap = {};
let tlColorIdx = 0;

function getActivityColor(name) {
  const key = (name || '').toLowerCase().trim();
  if (!tlColorMap[key]) {
    tlColorMap[key] = ACTIVITY_COLORS[tlColorIdx % ACTIVITY_COLORS.length];
    tlColorIdx++;
  }
  return tlColorMap[key];
}

function tlChangeDay(dir) {
  tlDate = new Date(tlDate.getTime() + dir * 86400000);
  renderTimeline();
}

function renderTimeline() {
  const wrap = document.getElementById('timelineWrap');
  const label = document.getElementById('tlDateLabel');
  const pending = document.getElementById('tlPending');
  if (!wrap) return;

  const todayStr = tlDate.toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  label.textContent = todayStr;

  const dayStart = new Date(tlDate);
  const dayEnd = new Date(tlDate.getTime() + 86400000);
  const dateStr = tlDate.toISOString().split('T')[0];

  // Collect completed activities for this day
  const activities = [];
  const usedIds = new Set();
  const sorted = [...state.logs].sort((a,b) => new Date(a.time) - new Date(b.time));

  sorted.forEach(e => {
    if (usedIds.has(e.id)) return;
    if (e.type === 'activity-end') {
      const matchStart = sorted.find(l =>
        !usedIds.has(l.id) && l.isStart && l.activity &&
        activitySimilarity(l.activity, e.activity) &&
        new Date(l.time) <= new Date(e.time)
      );
      if (matchStart) {
        usedIds.add(matchStart.id); usedIds.add(e.id);
        const startD = new Date(matchStart.time);
        const endD = new Date(e.time);
        if (startD >= dayStart && startD < dayEnd) {
          activities.push({ name: e.matchedActivity || e.activity || matchStart.activity, start: startD, end: endD });
        }
      }
    }
  });

  // Pending (running) activities
  const pendingActs = sorted.filter(e => e.type === 'activity-start' && !e.matched && !usedIds.has(e.id));
  if (pendingActs.length > 0) {
    const pa = pendingActs[pendingActs.length - 1];
    const sinceT = new Date(pa.time).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
    const actLabel = (pa.activity || pa.text || '').replace(/\b\w/g, c => c.toUpperCase());
    pending.innerHTML = `<div class="tl-pending-block">
      <div class="tl-pending-dot"></div>
      <div>
        <div class="tl-pending-text">⏳ ${actLabel} chal raha hai</div>
        <div class="tl-pending-since">Shuru: ${sinceT}</div>
      </div>
    </div>`;
  } else {
    pending.innerHTML = '';
  }

  // Build 24-hour grid
  const now = new Date();
  const isToday = dateStr === now.toISOString().split('T')[0];
  const nowMinutes = isToday ? now.getHours() * 60 + now.getMinutes() : -1;

  let html = '';
  for (let h = 0; h < 24; h++) {
    const hLabel = h === 0 ? '12am' : h < 12 ? `${h}am` : h === 12 ? '12pm' : `${h-12}pm`;
    const hourStart = h * 60;
    const hourEnd = (h + 1) * 60;

    // Find activities that overlap with this hour
    const hourActs = activities.filter(a => {
      const aStart = a.start.getHours() * 60 + a.start.getMinutes();
      const aEnd = a.end.getHours() * 60 + a.end.getMinutes();
      return aStart < hourEnd && aEnd > hourStart;
    });

    let nowLineHtml = '';
    if (nowMinutes >= hourStart && nowMinutes < hourEnd) {
      const pct = ((nowMinutes - hourStart) / 60) * 40;
      nowLineHtml = `<div class="tl-now-dot" style="top:${pct + 4}px"></div><div class="tl-now-line" style="top:${pct + 8}px"></div>`;
    }

    let blocksHtml = '';
    hourActs.forEach(a => {
      const aStartMin = a.start.getHours() * 60 + a.start.getMinutes();
      const aEndMin = a.end.getHours() * 60 + a.end.getMinutes();
      const startT = a.start.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
      const endT = a.end.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
      const color = getActivityColor(a.name);
      const actLabel = (a.name || '').replace(/\b\w/g, c => c.toUpperCase());
      // Only show block header in the starting hour
      if (aStartMin >= hourStart && aStartMin < hourEnd) {
        blocksHtml += `<div class="tl-block" style="background:${color}88;border-left:3px solid ${color};">
          <span>${actLabel}</span>
          <span class="tl-block-time">${startT}→${endT}</span>
        </div>`;
      }
    });

    html += `<div class="tl-hour-row">
      <div class="tl-hour-label">${hLabel}</div>
      <div class="tl-hour-line" style="position:relative;">
        ${nowLineHtml}
        ${blocksHtml}
      </div>
    </div>`;
  }

  if (activities.length === 0 && !isToday) {
    wrap.innerHTML = `<div class="tl-empty">Is din koi activity record nahi hui</div>` + html;
  } else {
    wrap.innerHTML = html;
  }

  // Scroll to current time or first activity
  if (isToday) {
    setTimeout(() => {
      const rows = wrap.querySelectorAll('.tl-hour-row');
      const scrollTo = Math.max(0, now.getHours() - 2);
      if (rows[scrollTo]) rows[scrollTo].scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

// ============ STREAK ============
function renderStreak() {
  const row = document.getElementById('streakRow');
  const days = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date(Date.now() - i * 86400000);
    const dStr = d.toISOString().split('T')[0];
    const hasLog = state.logs.some(l => l.time.startsWith(dStr));
    days.push({ d, hasLog });
  }
  row.innerHTML = `<span class="streak-label">14D</span>` + days.map(({ d, hasLog }) =>
    `<div class="streak-dot ${hasLog ? 'has-log' : ''}" title="${d.toDateString()}">${hasLog ? '●' : '·'}</div>`
  ).join('');
}

// ============ EXPENSE ============
function renderExpense() {
  const list = document.getElementById('expenseList');
  const summary = document.getElementById('expenseSummary');

  if (state.expenses.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">💸</div>Koi expense nahi<br>Log mein ₹ amount likho auto-detect hoga</div>`;
    summary.innerHTML = `<div class="exp-stat"><div class="exp-stat-val">₹0</div><div class="exp-stat-label">Aaj</div></div><div class="exp-stat"><div class="exp-stat-val">₹0</div><div class="exp-stat-label">Is hafte</div></div>`;
    return;
  }

  const today = new Date().toISOString().split('T')[0];
  const week = Date.now() - 7 * 86400000;
  const todayTotal = state.expenses.filter(e => e.time.startsWith(today)).reduce((s, e) => s + e.amount, 0);
  const weekTotal = state.expenses.filter(e => new Date(e.time) > week).reduce((s, e) => s + e.amount, 0);

  summary.innerHTML = `
    <div class="exp-stat"><div class="exp-stat-val">₹${todayTotal}</div><div class="exp-stat-label">Aaj</div></div>
    <div class="exp-stat"><div class="exp-stat-val">₹${weekTotal}</div><div class="exp-stat-label">Is Hafte</div></div>
    <div class="exp-stat"><div class="exp-stat-val">${state.expenses.length}</div><div class="exp-stat-label">Total Entries</div></div>
    <div class="exp-stat"><div class="exp-stat-val">₹${state.expenses.reduce((s, e) => s + e.amount, 0)}</div><div class="exp-stat-label">Total Ever</div></div>
  `;

  list.innerHTML = state.expenses.map(e => {
    const t = new Date(e.time).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: true });
    return `<div class="expense-item">
      <div class="expense-item-left">
        <div class="expense-item-desc">${e.text}</div>
        <div class="expense-item-date">${t}</div>
        <span class="expense-item-cat">${e.category}</span>
      </div>
      <div class="expense-item-amount">₹${e.amount}</div>
    </div>`;
  }).join('');
}

// ============ MISTAKES ============
function addMistake() {
  const inp = document.getElementById('mistakeInput');
  const text = inp.value.trim();
  if (!text) return;
  state.mistakes.unshift({ id: Date.now(), text, time: new Date().toISOString() });
  save();
  inp.value = '';
  renderMistakes();
  showToast('Mistake record ho gaya 📝');
}

function deleteMistake(id) {
  state.mistakes = state.mistakes.filter(m => m.id !== id);
  save();
  renderMistakes();
}

function renderMistakes() {
  const list = document.getElementById('mistakeList');
  if (state.mistakes.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">✨</div>Koi mistake nahi record hui<br>Seekhne ka mauka har din hota hai</div>`;
    return;
  }
  list.innerHTML = state.mistakes.map(m => {
    const t = new Date(m.time).toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
    return `<div class="mistake-item">
      <button class="mistake-del-btn" onclick="deleteMistake(${m.id})">✕</button>
      <div class="mistake-item-date">${t}</div>
      <div class="mistake-item-text">${m.text}</div>
    </div>`;
  }).join('');
}

// ============ ANALYSIS ============
async function runAnalysis() {
  const apiKey = state.apiKey;
  if (!apiKey) {
    showToast('Pehle Settings mein API Key daalo ⚙️');
    openSettings();
    return;
  }

  const from = document.getElementById('dateFrom').value;
  const to = document.getElementById('dateTo').value;
  const fromDate = new Date(from);
  const toDate = new Date(to);
  toDate.setHours(23, 59, 59);

  const filteredLogs = state.logs.filter(l => {
    const d = new Date(l.time);
    return d >= fromDate && d <= toDate;
  });
  const filteredExpenses = state.expenses.filter(e => {
    const d = new Date(e.time);
    return d >= fromDate && d <= toDate;
  });
  const filteredMistakes = state.mistakes.filter(m => {
    const d = new Date(m.time);
    return d >= fromDate && d <= toDate;
  });

  if (filteredLogs.length === 0 && filteredExpenses.length === 0 && filteredMistakes.length === 0) {
    document.getElementById('analysisOutput').innerHTML = `<div class="empty-state"><div class="empty-icon">📊</div>Is period mein koi data nahi</div>`;
    return;
  }

  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true;
  btn.innerHTML = `<span class="loading-dots"><span></span><span></span><span></span></span> Analyze ho raha hai...`;

  document.getElementById('analysisOutput').innerHTML = `<div class="analysis-loading"><div class="loading-dots"><span></span><span></span><span></span></div><p>AI tera data padh raha hai...</p></div>`;

  const dataStr = `
LOGS (${from} to ${to}):
${filteredLogs.map(l => `[${new Date(l.time).toLocaleString('en-IN')}] ${l.mood ? l.mood + ' ' : ''}${l.text}${l.sleepCalc ? ' | ' + l.sleepCalc : ''}`).join('\n')}

EXPENSES:
${filteredExpenses.map(e => `[${new Date(e.time).toLocaleDateString('en-IN')}] ₹${e.amount} - ${e.text} (${e.category})`).join('\n')}
Total Expenses: ₹${filteredExpenses.reduce((s, e) => s + e.amount, 0)}

MISTAKES:
${filteredMistakes.map(m => `[${new Date(m.time).toLocaleDateString('en-IN')}] ${m.text}`).join('\n')}
`;

  const prompt = `You are analyzing the personal life data of ${state.userName || 'the user'}. Please analyze this data and provide insights in Hinglish (Hindi + English mix).

DATA:
${dataStr}

Please provide:
1. 📊 PATTERNS - Kya patterns dikh rahe hain? (time, behavior, habits)
2. 😴 SLEEP ANALYSIS - Neend ke patterns kya hain?
3. 💸 EXPENSE PATTERNS - Paise kahan ja rahe hain?
4. ❌ MISTAKE PATTERNS - Galtiyan repeat ho rahi hain kya?
5. 💡 KEY INSIGHTS - 3 sabse important observations
6. 🎯 SUGGESTIONS - 3 actionable improvements

Be specific, use the actual data points, be honest and direct. Write in a friendly but analytical tone.`;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1500,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    const data = await response.json();
    if (data.error) throw new Error(data.error.message);

    const result = data.content[0].text;
    // Format output
    let formatted = result
      .replace(/\n\n/g, '</p><p>')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/^##\s(.+)$/gm, '<h3>$1</h3>')
      .replace(/^#\s(.+)$/gm, '<h3>$1</h3>');

    document.getElementById('analysisOutput').innerHTML = `<div class="analysis-result"><p>${formatted}</p></div>`;

  } catch (err) {
    document.getElementById('analysisOutput').innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div>Error: ${err.message}<br><br>API Key check karo Settings mein</div>`;
  }

  btn.disabled = false;
  btn.innerHTML = '🔍 AI SE ANALYSIS KARO';
}

// ============ DOWNLOAD ============
function downloadCSV() {
  let csv = 'Type,Date,Time,Text,Amount,Mood,Category\n';
  state.logs.forEach(l => {
    const d = new Date(l.time);
    csv += `Log,${d.toLocaleDateString('en-IN')},${d.toLocaleTimeString('en-IN')},"${l.text.replace(/"/g,'""')}",,"${l.mood}",\n`;
  });
  state.expenses.forEach(e => {
    const d = new Date(e.time);
    csv += `Expense,${d.toLocaleDateString('en-IN')},${d.toLocaleTimeString('en-IN')},"${e.text.replace(/"/g,'""')}",${e.amount},,"${e.category}"\n`;
  });
  state.mistakes.forEach(m => {
    const d = new Date(m.time);
    csv += `Mistake,${d.toLocaleDateString('en-IN')},${d.toLocaleTimeString('en-IN')},"${m.text.replace(/"/g,'""')}",,,\n`;
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `life-tracker-${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
  showToast('CSV download ho raha hai ✅');
}

function downloadPDF() {
  window.print();
}

// ============ SETTINGS ============
function openSettings() {
  document.getElementById('apiKeyInput').value = state.apiKey;
  document.getElementById('userNameInput').value = state.userName;
  renderShortcutManage();
  document.getElementById('settingsModal').classList.add('open');
}

function closeSettingsOutside(e) {
  if (e.target === document.getElementById('settingsModal')) closeSettings();
}

function closeSettings() {
  document.getElementById('settingsModal').classList.remove('open');
}

function saveSettings() {
  state.apiKey = document.getElementById('apiKeyInput').value.trim();
  state.userName = document.getElementById('userNameInput').value.trim();
  save();
  closeSettings();
  showToast('Settings save ho gayi ✅');
}

function clearAllData() {
  if (confirm('Pakka? Saara data delete ho jaayega!')) {
    state.logs = [];
    state.expenses = [];
    state.mistakes = [];
    save();
    renderLogFeed();
    renderExpense();
    renderMistakes();
    renderStreak();
    closeSettings();
    showToast('Data clear ho gaya');
  }
}

// ============ TOAST ============
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ============ INPUT AUTO RESIZE ============
document.getElementById('logInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// Enter to submit (Shift+Enter for newline)
document.getElementById('logInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    addLog();
  }
});

document.getElementById('mistakeInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && e.ctrlKey) addMistake();
});

// ============ START ============
init();
