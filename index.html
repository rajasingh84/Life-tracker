<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0e0c">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Life Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root {
  --bg:#0f0e0c;--bg2:#1a1814;--surface:#2a2520;--border:#3a3530;
  --text:#e8e0d0;--muted:#7a7060;--accent:#d4a843;--accent2:#e07a3a;
  --danger:#c0392b;--green:#5a9a6a;--blue:#4a7fa0;
  --tab-h:58px;--header-h:54px;--r:12px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'DM Mono',monospace}
.header{height:var(--header-h);background:var(--bg2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:fixed;top:0;left:0;right:0;z-index:100}
.header-title{font-family:'Syne',sans-serif;font-weight:800;font-size:18px;color:var(--accent);letter-spacing:-0.5px}
.header-title span{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
.gear-btn{width:34px;height:34px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--muted);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tabs{position:fixed;bottom:0;left:0;right:0;height:var(--tab-h);background:var(--bg2);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);z-index:100}
.tab-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:none;border:none;color:var(--muted);cursor:pointer;font-family:'Syne',sans-serif;font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;position:relative;transition:color 0.2s}
.tab-btn.active{color:var(--accent)}
.tab-btn .ti{font-size:18px}
.tab-btn::after{content:'';position:absolute;bottom:0;left:20%;right:20%;height:2px;background:var(--accent);border-radius:2px 2px 0 0;opacity:0;transition:opacity 0.2s}
.tab-btn.active::after{opacity:1}
.page{position:fixed;top:var(--header-h);left:0;right:0;bottom:var(--tab-h);overflow-y:auto;display:none;-webkit-overflow-scrolling:touch}
.page.active{display:block}

/* RUNNING BANNER */
.running-banner{display:none;background:rgba(90,154,106,0.12);border-bottom:1px solid rgba(90,154,106,0.3);padding:10px 14px;align-items:center;gap:10px}
.running-banner.show{display:flex}
.running-dot{width:9px;height:9px;border-radius:50%;background:var(--green);animation:pulse 1.4s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.4;transform:scale(0.7)}}
.running-text{flex:1;font-family:'Syne',sans-serif;font-size:13px;font-weight:700;color:var(--green)}
.running-since{font-size:10px;color:var(--muted);margin-top:1px}
.running-cancel{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:2px 6px}

/* SHORTCUTS */
.sc-bar{padding:8px 12px 6px;display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.sc-bar::-webkit-scrollbar{display:none}
.sc-chip{flex-shrink:0;padding:5px 10px;background:var(--surface);border:1px solid var(--border);border-radius:20px;font-size:11px;font-family:'DM Mono',monospace;color:var(--text);cursor:pointer;transition:all 0.15s;white-space:nowrap}
.sc-chip:active{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.sc-add{flex-shrink:0;width:28px;height:28px;background:none;border:1px dashed var(--border);border-radius:20px;color:var(--muted);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}

/* STREAK */
.streak-row{padding:7px 12px;display:flex;gap:5px;align-items:center;border-bottom:1px solid var(--border);background:var(--bg2)}
.s-lbl{font-size:10px;color:var(--muted);font-family:'Syne',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-right:2px}
.s-dot{width:16px;height:16px;border-radius:4px;background:var(--surface);border:1px solid var(--border);font-size:8px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.s-dot.on{background:rgba(212,168,67,0.25);border-color:var(--accent)}

/* LOG FEED */
.log-feed{padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-height:100px}
.date-sep{text-align:center;font-size:10px;color:var(--muted);padding:6px 0 2px;font-family:'Syne',sans-serif;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.log-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;position:relative}
.log-card.activity{border-left:3px solid var(--accent)}
.log-card.expense-card{border-left:3px solid var(--accent2)}
.log-card.note-card{border-left:3px solid var(--blue)}
.card-del{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--border);font-size:13px;cursor:pointer;padding:2px 5px}
.card-del:active{color:var(--danger)}
.card-time{font-size:10px;color:var(--muted);margin-bottom:4px}
.card-title{font-family:'Syne',sans-serif;font-size:15px;font-weight:700;color:var(--text)}
.card-raw{font-size:11px;color:var(--muted);margin-top:3px;font-style:italic}
.card-dur{display:inline-flex;align-items:center;gap:4px;margin-top:6px;padding:3px 9px;border-radius:8px;font-size:12px;background:rgba(212,168,67,0.15);color:var(--accent);font-family:'DM Mono',monospace;font-weight:500}
.card-mood{display:inline-block;margin-top:5px;margin-left:5px;font-size:14px}
.empty-state{text-align:center;padding:50px 20px;color:var(--muted);font-size:13px;line-height:2}
.empty-icon{font-size:36px;margin-bottom:10px}

/* INPUT */
.input-area{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--border);padding:8px 12px}
.mood-row{display:flex;gap:5px;align-items:center;margin-bottom:6px}
.mood-lbl{font-size:10px;color:var(--muted);margin-right:2px}
.mood-btn{width:26px;height:26px;border-radius:7px;border:1px solid var(--border);background:var(--surface);font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
.mood-btn.sel{border-color:var(--accent);background:rgba(212,168,67,0.15)}
.input-row{display:flex;gap:8px;align-items:flex-end}
.log-input{flex:1;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;color:var(--text);font-family:'DM Mono',monospace;font-size:13px;resize:none;outline:none;min-height:42px;max-height:120px;overflow-y:auto;transition:border-color 0.2s;line-height:1.4}
.log-input:focus{border-color:var(--accent)}
.log-input::placeholder{color:var(--muted)}
.send-btn{width:42px;height:42px;background:var(--accent);border:none;border-radius:12px;color:var(--bg);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.15s}
.send-btn:active{transform:scale(0.92)}
.send-btn:disabled{opacity:0.5}

/* DAY PAGE */
.day-nav{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.day-lbl{font-family:'Syne',sans-serif;font-size:13px;font-weight:800;color:var(--text)}
.nav-btn{background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:5px 14px;font-size:16px;cursor:pointer}
.day-running{margin:8px 12px 0}
.day-running-item{background:rgba(90,154,106,0.1);border:1px dashed rgba(90,154,106,0.4);border-radius:var(--r);padding:8px 12px;display:flex;align-items:center;gap:8px}
.day-tl{padding:0 12px 30px;position:relative}
.tl-row{display:flex;min-height:48px}
.tl-hr{width:42px;flex-shrink:0;font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;padding-top:5px;text-align:right;padding-right:10px}
.tl-line{flex:1;border-top:1px solid var(--border);padding-top:4px;position:relative;min-height:44px}
.tl-block{border-radius:6px;padding:4px 8px;font-size:11px;font-family:'Syne',sans-serif;font-weight:700;margin-bottom:3px;display:flex;justify-content:space-between;align-items:center;color:#fff}
.tl-bt{font-size:9px;opacity:0.75;flex-shrink:0;margin-left:6px}
.now-line{position:absolute;left:-4px;right:0;height:2px;background:var(--danger);z-index:3}
.now-dot{position:absolute;width:8px;height:8px;background:var(--danger);border-radius:50%;left:-8px;margin-top:-3px;z-index:3}

/* EXPENSE */
.exp-summary{margin:12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.exp-stat{text-align:center}
.exp-val{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;color:var(--accent)}
.exp-lbl{font-size:10px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:0.5px}
.exp-list{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
.exp-item{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.exp-desc{font-size:13px;color:var(--text)}
.exp-date{font-size:10px;color:var(--muted);margin-top:2px}
.exp-cat{font-size:10px;padding:2px 7px;border-radius:8px;background:var(--surface);color:var(--muted);margin-top:3px;display:inline-block}
.exp-amt{font-family:'Syne',sans-serif;font-size:16px;font-weight:700;color:var(--accent2)}
.sec-hdr{padding:10px 12px 5px;font-family:'Syne',sans-serif;font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px}

/* MISTAKE */
.mistake-input{padding:12px;border-bottom:1px solid var(--border)}
.m-ta{width:100%;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px;color:var(--text);font-family:'Instrument Serif',serif;font-size:15px;resize:none;outline:none;min-height:80px;line-height:1.6;transition:border-color 0.2s}
.m-ta:focus{border-color:var(--danger)}
.m-ta::placeholder{color:var(--muted);font-style:italic}
.m-add{margin-top:8px;width:100%;padding:10px;background:rgba(192,57,43,0.12);border:1px solid rgba(192,57,43,0.25);border-radius:var(--r);color:var(--danger);font-family:'Syne',sans-serif;font-size:12px;font-weight:700;cursor:pointer}
.m-list{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.m-item{background:var(--bg2);border:1px solid var(--border);border-left:3px solid var(--danger);border-radius:var(--r);padding:10px 12px;position:relative}
.m-del{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--border);font-size:13px;cursor:pointer;padding:2px 5px}
.m-del:active{color:var(--danger)}
.m-date{font-size:10px;color:var(--muted);margin-bottom:4px}
.m-text{font-family:'Instrument Serif',serif;font-size:14px;line-height:1.6;color:var(--text)}

/* ANALYSIS */
.an-top{padding:12px;background:var(--bg2);border-bottom:1px solid var(--border)}
.dr{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.dr-w label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;display:block;margin-bottom:4px}
.dr-w input[type=date]{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 10px;color:var(--text);font-family:'DM Mono',monospace;font-size:12px;outline:none}
.dr-w input[type=date]::-webkit-calendar-picker-indicator{filter:invert(0.7)}
.ai-btn{width:100%;padding:12px;background:var(--accent);border:none;border-radius:var(--r);color:var(--bg);font-family:'Syne',sans-serif;font-size:14px;font-weight:800;cursor:pointer;transition:all 0.15s}
.ai-btn:disabled{opacity:0.5;cursor:not-allowed}
.ai-result{padding:12px;font-size:13px;line-height:1.9;color:var(--text);font-family:'DM Mono',monospace;white-space:pre-wrap}
.ai-result h3{font-family:'Syne',sans-serif;color:var(--accent);font-size:14px;margin:14px 0 5px}
.chart-wrap{margin:10px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px}
.chart-wrap h4{font-family:'Syne',sans-serif;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px}
.dl-row{padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dl-btn{padding:12px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);color:var(--text);font-family:'Syne',sans-serif;font-size:11px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:5px;transition:all 0.15s}
.dl-btn span:first-child{font-size:18px}
.dl-btn:active{background:var(--accent);color:var(--bg);border-color:var(--accent)}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:999;display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex}
.sheet{background:var(--bg2);border-radius:20px 20px 0 0;border:1px solid var(--border);border-bottom:none;width:100%;max-width:500px;padding:20px;max-height:85vh;overflow-y:auto;animation:su 0.3s ease}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sh{width:40px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.st{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;margin-bottom:16px}
.fl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-top:14px;margin-bottom:5px;display:block}
.fi{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-family:'DM Mono',monospace;font-size:12px;outline:none}
.fi:focus{border-color:var(--accent)}
.sv-btn{margin-top:16px;width:100%;padding:12px;background:var(--accent);border:none;border-radius:var(--r);color:var(--bg);font-family:'Syne',sans-serif;font-size:14px;font-weight:800;cursor:pointer}
.sc-ml{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.sc-mi{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--surface);border-radius:10px;font-size:13px}
.sc-rb{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer}
.sc-rb:active{color:var(--danger)}

/* TOAST */
.toast{position:fixed;top:calc(var(--header-h)+8px);left:50%;transform:translateX(-50%) translateY(-20px);background:var(--accent);color:var(--bg);padding:7px 16px;border-radius:20px;font-size:12px;font-family:'Syne',sans-serif;font-weight:700;opacity:0;transition:all 0.3s;z-index:9999;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* DOTS LOADER */
.dots{display:inline-flex;gap:4px;align-items:center}
.dots span{width:5px;height:5px;border-radius:50%;background:var(--bg);animation:db 1.2s infinite}
.dots span:nth-child(2){animation-delay:0.2s}.dots span:nth-child(3){animation-delay:0.4s}
@keyframes db{0%,80%,100%{transform:translateY(0);opacity:0.4}40%{transform:translateY(-5px);opacity:1}}

/* FOOD PAGE */
.food-top{padding:12px;background:var(--bg2);border-bottom:1px solid var(--border)}
.cal-bar-wrap{margin-bottom:10px}
.cal-bar-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:5px}
.cal-bar-label span:last-child{color:var(--accent);font-weight:700}
.cal-bar{height:8px;background:var(--surface);border-radius:4px;overflow:hidden}
.cal-bar-fill{height:100%;background:linear-gradient(90deg,var(--green),var(--accent));border-radius:4px;transition:width 0.4s}
.cal-bar-fill.over{background:linear-gradient(90deg,var(--accent),var(--danger))}
.cal-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.cal-stat{background:var(--surface);border-radius:10px;padding:8px;text-align:center}
.cal-stat-val{font-family:'Syne',sans-serif;font-size:16px;font-weight:800;color:var(--accent)}
.cal-stat-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-top:2px}
.food-input-row{display:flex;gap:8px;align-items:flex-end}
.food-input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;color:var(--text);font-family:'DM Mono',monospace;font-size:13px;resize:none;outline:none;min-height:42px;max-height:100px;line-height:1.4;transition:border-color 0.2s}
.food-input:focus{border-color:var(--green)}
.food-input::placeholder{color:var(--muted)}
.food-send{width:42px;height:42px;background:var(--green);border:none;border-radius:12px;color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.food-send:disabled{opacity:0.5}
.food-list{padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.food-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;position:relative}
.food-card.meal-card{border-left:3px solid var(--green)}
.food-card.supp-card{border-left:3px solid var(--blue)}
.food-card-time{font-size:10px;color:var(--muted);margin-bottom:3px}
.food-card-name{font-family:'Syne',sans-serif;font-size:14px;font-weight:700;color:var(--text)}
.food-card-raw{font-size:11px;color:var(--muted);margin-top:2px;font-style:italic}
.food-macros{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.food-macro{padding:2px 8px;border-radius:8px;font-size:10px;font-family:'DM Mono',monospace}
.food-macro.cal{background:rgba(212,168,67,0.15);color:var(--accent)}
.food-macro.pro{background:rgba(74,127,160,0.15);color:var(--blue)}
.food-macro.carb{background:rgba(90,154,106,0.15);color:var(--green)}
.food-del{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--border);font-size:13px;cursor:pointer;padding:2px 5px}
.food-del:active{color:var(--danger)}
.food-tag{display:inline-block;font-size:9px;padding:2px 6px;border-radius:6px;margin-left:6px;text-transform:uppercase;font-weight:700;letter-spacing:0.5px}
.food-tag.meal{background:rgba(90,154,106,0.2);color:var(--green)}
.food-tag.supp{background:rgba(74,127,160,0.2);color:var(--blue)}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
</style>
</head>
<body>

<div class="header">
  <div class="header-title">LIFE<span id="hDate"></span></div>
  <button class="gear-btn" onclick="openSettings()">⚙️</button>
</div>
<div class="toast" id="toast"></div>

<!-- LOG PAGE -->
<div class="page active" id="page-log">
  <div class="running-banner" id="rBanner">
    <div class="running-dot"></div>
    <div style="flex:1">
      <div class="running-text" id="rText"></div>
      <div class="running-since" id="rSince"></div>
    </div>
    <button class="running-cancel" onclick="cancelRunning()">✕</button>
  </div>
  <div class="sc-bar" id="scBar"></div>
  <div class="streak-row" id="streakRow"></div>
  <div class="log-feed" id="logFeed"></div>
  <div class="input-area">
    <div class="mood-row">
      <span class="mood-lbl">MOOD:</span>
      <button class="mood-btn" data-m="😴" onclick="selMood(this)">😴</button>
      <button class="mood-btn" data-m="😐" onclick="selMood(this)">😐</button>
      <button class="mood-btn" data-m="🙂" onclick="selMood(this)">🙂</button>
      <button class="mood-btn" data-m="😤" onclick="selMood(this)">😤</button>
      <button class="mood-btn" data-m="🔥" onclick="selMood(this)">🔥</button>
    </div>
    <div class="input-row">
      <textarea class="log-input" id="logInput" placeholder="kya hua... start studying... 150 rs khana..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn" onclick="addLog()">↑</button>
    </div>
  </div>
</div>

<!-- DAY PAGE -->
<div class="page" id="page-day">
  <div class="day-nav">
    <button class="nav-btn" onclick="dayNav(-1)">‹</button>
    <div class="day-lbl" id="dayLbl"></div>
    <button class="nav-btn" onclick="dayNav(1)">›</button>
  </div>
  <div class="day-running" id="dayRunning"></div>

<script>
// STATE
let S = {
  logs:[],
  running:null,
  expenses:[],
  mistakes:[],
  foods:[],        // {id,type:'meal'|'supplement',name,raw,calories,protein,carbs,time}
  calorieGoal:2000,
  shortcuts:['chai ☕','gym 💪','study 📚','trading 📈','walk 🚶','sleep 😴'],
  apiKey:'',
  userName:''
};
let mood='';
let dayDate=new Date(); dayDate.setHours(0,0,0,0);
let charts={};

function init(){
  const s=localStorage.getItem('lt_v4');
  if(s) S={...S,...JSON.parse(s)};
  document.getElementById('hDate').textContent=' · '+new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short'});
  const today=new Date().toISOString().split('T')[0];
  const week=new Date(Date.now()-7*86400000).toISOString().split('T')[0];
  document.getElementById('dFrom').value=week;
  document.getElementById('dTo').value=today;
  renderAll();
}
function save(){localStorage.setItem('lt_v4',JSON.stringify(S))}

// ============ GEMINI API HELPER ============
async function callAI(prompt, maxTokens=500){
  const key = S.apiKey;
  if(!key) return null;
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-lite:generateContent?key=${key}`;
  const res = await fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      contents: [{parts: [{text: prompt}]}],
      generationConfig: {maxOutputTokens: maxTokens, temperature: 0.1}
    })
  });
  const d = await res.json();
  if(d.error) throw new Error(d.error.message);
  const text = d.candidates?.[0]?.content?.parts?.[0]?.text || null;
  return text ? text.replace(/```json\n?|```\n?/g,'').trim() : null;
}
function renderAll(){renderSc();renderStreak();renderBanner();renderFeed();renderExp();renderMist();renderFood()}

// TABS
function switchTab(n,b){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
  document.getElementById('page-'+n).classList.add('active');
  b.classList.add('active');
  if(n==='day') renderDay();
  if(n==='analysis') initCharts();
  if(n==='food') renderFood();
}

// MOOD
function selMood(b){
  document.querySelectorAll('.mood-btn').forEach(x=>x.classList.remove('sel'));
  b.classList.add('sel'); mood=b.dataset.m;
}

// SHORTCUTS
function renderSc(){
  const bar=document.getElementById('scBar'); bar.innerHTML='';
  S.shortcuts.forEach(s=>{
    const b=document.createElement('button'); b.className='sc-chip'; b.textContent=s;
    b.onclick=()=>{document.getElementById('logInput').value=s;document.getElementById('logInput').focus()};
    bar.appendChild(b);
  });
  const a=document.createElement('button'); a.className='sc-add'; a.textContent='+'; a.onclick=openSettings;
  bar.appendChild(a);
}
function addSc(){const v=document.getElementById('newSc').value.trim();if(!v)return;S.shortcuts.push(v);document.getElementById('newSc').value='';save();renderSc();renderScM();showToast('Shortcut add! ✅')}
function remSc(i){S.shortcuts.splice(i,1);save();renderSc();renderScM()}
function renderScM(){
  const l=document.getElementById('scManage'); l.innerHTML='';
  S.shortcuts.forEach((s,i)=>{const d=document.createElement('div');d.className='sc-mi';d.innerHTML=`<span>${s}</span><button class="sc-rb" onclick="remSc(${i})">✕</button>`;l.appendChild(d)});
}

// BANNER
function renderBanner(){
  const b=document.getElementById('rBanner');
  if(!S.running){b.classList.remove('show');return}
  b.classList.add('show');
  document.getElementById('rText').textContent='⏳ '+(S.running.display||S.running.activity)+' chal raha hai';
  const since=new Date(S.running.startTime).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
  document.getElementById('rSince').textContent='Shuru: '+since;
}
function cancelRunning(){if(!confirm('Cancel karna hai?'))return;S.running=null;save();renderBanner();showToast('Cancelled')}

// AI PARSE
async function aiParse(text){
  if(!S.apiKey) return null;
  const ctx=S.running
    ?`Currently running activity: "${S.running.activity}" (started at ${new Date(S.running.startTime).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true})})`
    :'No activity currently running';
  const now=new Date();
  const prompt=`You are a life tracker assistant. Parse this log entry and return ONLY valid JSON.

Entry: "${text}"
Context: ${ctx}
Current time: ${now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true})}
Today's date: ${now.toLocaleDateString('en-IN')}
Language: English, Hindi, Hinglish — understand all.

IMPORTANT: User may log PAST events retroactively. Examples:
- "10 baje se 1 baje tak padha" = completed activity from 10:00 to 13:00 today
- "subah 7 baje gym kiya 1 ghante" = completed activity at 7am for 1 hour
- "kal raat 11 baje so gaya aaj 7 baje utha" = sleep from yesterday 11pm to today 7am
- "watching reels from 10:00 to 1" = completed activity 10pm to 1am (or 10am to 1pm based on context)

Determine:
- type: "start" (just starting now), "end" (ending current running activity), "completed" (past activity with known start+end), "expense", "note"
- For "completed": extract startTime and endTime as ISO strings (use today's date if not specified)
- For "start"/"end": activity and display name
- For "expense": amount

Return JSON:
{
  "type": "start|end|completed|expense|note",
  "activity": "clean english name",
  "display": "Short Title",
  "amount": null or number,
  "category": "🍔 Food|🚗 Travel|📚 Study|💊 Health|📦 Other|💰 Finance|🎮 Entertainment",
  "startTime": null or "ISO datetime string",
  "endTime": null or "ISO datetime string",
  "duration": null or "Xh Ym"
}`;
  try{
    const raw = await callAI(prompt, 300);
    if(!raw) return null;
    const m=raw.match(/\{[\s\S]*\}/);
    return m?JSON.parse(m[0]):null;
  }catch(e){return null}
}

// FALLBACK (only when no API key)
function fbParse(text){
  const t=text.toLowerCase();
  const em=text.match(/(\d+(?:\.\d+)?)\s*(?:rs|rupees?|₹)|(?:rs|rupees?|₹)\s*(\d+(?:\.\d+)?)/i);
  const amt=em?parseFloat(em[1]||em[2]):null;
  if(amt) return{type:'expense',activity:null,display:text.slice(0,25),amount:amt,category:'📦 Other'};
  // Very basic start/end detection as last resort
  const isS=/start|shuru|begin|chalu|so gaya/i.test(t);
  const isE=/end|khatam|done|finish|stop|ho gaya|uth gaya/i.test(t);
  if(isS&&!isE) return{type:'start',activity:text,display:text.slice(0,20),amount:null,category:null};
  if(isE) return{type:'end',activity:text,display:text.slice(0,20),amount:null,category:null};
  return{type:'note',activity:null,display:text.slice(0,30),amount:null,category:null};
}

// ADD LOG - MAIN LOGIC
async function addLog(){
  const inp=document.getElementById('logInput');
  const text=inp.value.trim();
  if(!text)return;
  const btn=document.getElementById('sendBtn');
  btn.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';
  btn.disabled=true;
  inp.value=''; inp.style.height='auto';
  const now=new Date();
  const curMood=mood;
  document.querySelectorAll('.mood-btn').forEach(b=>b.classList.remove('sel'));
  mood='';

  let p=await aiParse(text);
  if(!p) p=fbParse(text);

  if(p.type==='start'){
    S.running={id:Date.now(),activity:p.activity||text,display:p.display||text,startTime:now.toISOString(),mood:curMood,rawText:text};
    save(); renderBanner();
    showToast('▶ '+(p.display||p.activity)+' shuru!');

  } else if(p.type==='completed'){
    // Past activity — directly log with given times
    const sT=p.startTime?new Date(p.startTime):now;
    const eT=p.endTime?new Date(p.endTime):now;
    const diff=eT-sT;
    const tm=Math.floor(Math.abs(diff)/60000);
    const h=Math.floor(tm/60), m=tm%60;
    const dur=p.duration||(h>0?`${h}h ${m}m`:`${m}m`);
    const entry={id:Date.now(),type:'activity',display:p.display||p.activity||text,activity:p.activity||text,startTime:sT.toISOString(),endTime:eT.toISOString(),duration:dur,mood:curMood,rawStart:text,rawEnd:text};
    S.logs.unshift(entry);
    save(); renderFeed(); renderStreak();
    showToast('✅ '+entry.display+' — '+dur+' (past log)');

  } else if(p.type==='end'){
    if(S.running){
      const diff=now-new Date(S.running.startTime);
      const tm=Math.floor(diff/60000);
      const h=Math.floor(tm/60), m=tm%60;
      const dur=h>0?`${h}h ${m}m`:`${m}m`;
      const entry={id:S.running.id,type:'activity',display:S.running.display,activity:S.running.activity,startTime:S.running.startTime,endTime:now.toISOString(),duration:dur,mood:S.running.mood||curMood,rawStart:S.running.rawText,rawEnd:text};
      S.logs.unshift(entry);
      S.running=null;
      save(); renderBanner(); renderFeed(); renderStreak();
      showToast('✅ '+entry.display+' — '+dur);
    } else {
      S.logs.unshift({id:Date.now(),type:'note',display:text,text,time:now.toISOString(),mood:curMood});
      save(); renderFeed(); renderStreak();
      showToast('Logged (koi activity run nahi thi)');
    }

  } else if(p.type==='expense'&&p.amount>0){
    const entry={id:Date.now(),type:'expense',display:p.display||text,text,time:now.toISOString(),amount:p.amount,category:p.category||'📦 Other',mood:curMood};
    S.logs.unshift(entry);
    S.expenses.unshift({id:entry.id,text,amount:p.amount,time:now.toISOString(),category:entry.category});
    save(); renderFeed(); renderExp(); renderStreak();
    showToast('💸 ₹'+p.amount+' logged!');

  } else {
    S.logs.unshift({id:Date.now(),type:'note',display:p.display||text,text,time:now.toISOString(),mood:curMood});
    save(); renderFeed(); renderStreak();
    showToast('Logged! ✅');
  }

  btn.innerHTML='↑'; btn.disabled=false;
}

// RENDER LOG FEED
function renderFeed(){
  const feed=document.getElementById('logFeed');
  if(!S.logs.length){feed.innerHTML='<div class="empty-state"><div class="empty-icon">📝</div>Koi log nahi abhi<br>Kuch bhi likho neeche...</div>';return}
  const grouped={};
  S.logs.forEach(e=>{
    const t=e.startTime||e.time;
    const d=new Date(t).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
    if(!grouped[d])grouped[d]=[];
    grouped[d].push(e);
  });
  let html='';
  Object.entries(grouped).forEach(([date,entries])=>{
    html+=`<div class="date-sep">${date}</div>`;
    entries.forEach(e=>{
      if(e.type==='activity'){
        const st=new Date(e.startTime).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
        const et=new Date(e.endTime).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
        html+=`<div class="log-card activity"><button class="card-del" onclick="delLog(${e.id})">🗑</button><div class="card-time">${st} → ${et}</div><div class="card-title">${e.display}</div><div><span class="card-dur">⏱ ${e.duration}</span>${e.mood?`<span class="card-mood">${e.mood}</span>`:''}</div></div>`;
      }else if(e.type==='expense'){
        const t2=new Date(e.time).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
        html+=`<div class="log-card expense-card"><button class="card-del" onclick="delLog(${e.id})">🗑</button><div class="card-time">${t2}</div><div class="card-title">₹${e.amount}</div><div class="card-raw">${e.text}</div><span class="exp-cat">${e.category}</span>${e.mood?`<span class="card-mood">${e.mood}</span>`:''}</div>`;
      }else{
        const t2=new Date(e.time||e.startTime).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
        html+=`<div class="log-card note-card"><button class="card-del" onclick="delLog(${e.id})">🗑</button><div class="card-time">${t2}</div><div class="card-title">${e.display||e.text}</div>${e.mood?`<span class="card-mood">${e.mood}</span>`:''}</div>`;
      }
    });
  });
  feed.innerHTML=html;
}
function delLog(id){if(!confirm('Delete?'))return;S.logs=S.logs.filter(l=>l.id!==id);S.expenses=S.expenses.filter(e=>e.id!==id);save();renderFeed();renderExp()}

// STREAK
function renderStreak(){
  const r=document.getElementById('streakRow');
  let h='<span class="s-lbl">14D</span>';
  for(let i=13;i>=0;i--){
    const d=new Date(Date.now()-i*86400000);
    const ds=localDateStr(d);
    const has=S.logs.some(l=>localDateStr(new Date(l.startTime||l.time))===ds);
    h+=`<div class="s-dot ${has?'on':''}">${has?'●':'·'}</div>`;
  }
  r.innerHTML=h;
}

// DAY VIEW
const COLORS=['#d4a843','#e07a3a','#4a7fa0','#5a9a6a','#9a5a9a','#c0392b','#2980b9','#27ae60'];
const cmap={};let cidx=0;
function getC(n){const k=(n||'').toLowerCase();if(!cmap[k]){cmap[k]=COLORS[cidx%COLORS.length];cidx++}return cmap[k]}
function localDateStr(date) {
  const d = new Date(date);
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function dayNav(d){dayDate=new Date(dayDate.getTime()+d*86400000);renderDay()}
function renderDay(){
  const lbl=document.getElementById('dayLbl'),tl=document.getElementById('dayTl'),dr=document.getElementById('dayRunning');
  if(!lbl)return;
  lbl.textContent=dayDate.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',year:'numeric'});
  const ds=localDateStr(dayDate);
  const now=new Date();
  const isToday=ds===localDateStr(now);
  if(S.running&&isToday){
    const since=new Date(S.running.startTime).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
    dr.innerHTML=`<div class="day-running-item"><div class="running-dot"></div><div><div class="running-text">⏳ ${S.running.display} chal raha hai</div><div class="running-since">Shuru: ${since}</div></div></div>`;
  }else{dr.innerHTML=''}

  const acts=S.logs.filter(l=>l.type==='activity'&&localDateStr(new Date(l.startTime))===ds);
  const nowM=isToday?now.getHours()*60+now.getMinutes():-1;
  const PX_PER_MIN=1.2; // pixels per minute
  const HOUR_H=PX_PER_MIN*60; // 72px per hour

  // Build hour labels
  let hoursHtml='';
  for(let h=0;h<24;h++){
    const hl=h===0?'12am':h<12?`${h}am`:h===12?'12pm':`${h-12}pm`;
    hoursHtml+=`<div style="height:${HOUR_H}px;display:flex;align-items:flex-start;padding-top:4px"><span style="font-size:10px;color:var(--muted);font-family:'DM Mono',monospace;width:42px;flex-shrink:0;text-align:right;padding-right:10px">${hl}</span><div style="flex:1;border-top:1px solid var(--border)"></div></div>`;
  }

  // Build activity blocks with absolute positioning
  let blocksHtml='';
  acts.forEach(a=>{
    const aS=new Date(a.startTime);
    const aE=new Date(a.endTime);
    const startMin=aS.getHours()*60+aS.getMinutes();
    const endMin=aE.getHours()*60+aE.getMinutes();
    const top=startMin*PX_PER_MIN;
    const height=Math.max((endMin-startMin)*PX_PER_MIN, 20);
    const c=getC(a.activity);
    const st=aS.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
    const et=aE.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
    blocksHtml+=`<div style="position:absolute;top:${top}px;left:52px;right:4px;height:${height}px;background:${c}cc;border-left:3px solid ${c};border-radius:6px;padding:3px 8px;overflow:hidden;box-sizing:border-box">
      <div style="font-family:'Syne',sans-serif;font-size:11px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${a.display}</div>
      ${height>30?`<div style="font-size:9px;color:rgba(255,255,255,0.8)">${st} → ${et} · ${a.duration}</div>`:''}
    </div>`;
  });

  // Now line
  let nowLineHtml='';
  if(nowM>=0){
    const nowTop=nowM*PX_PER_MIN;
    nowLineHtml=`<div style="position:absolute;top:${nowTop}px;left:42px;right:0;height:2px;background:var(--danger);z-index:3"></div><div style="position:absolute;top:${nowTop-4}px;left:36px;width:10px;height:10px;background:var(--danger);border-radius:50%;z-index:3"></div>`;
  }

  tl.innerHTML=`<div style="position:relative;height:${24*HOUR_H}px">${hoursHtml}<div style="position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none">${blocksHtml}${nowLineHtml}</div></div>`;

  // Scroll to current time or first activity
  if(isToday){
    setTimeout(()=>{
      const scrollTo=Math.max(0,now.getHours()-2)*HOUR_H;
      document.getElementById('page-day').scrollTop=scrollTo;
    },100);
  } else if(acts.length){
    const firstAct=acts[0];
    const scrollTo=Math.max(0,new Date(firstAct.startTime).getHours()-1)*HOUR_H;
    setTimeout(()=>{document.getElementById('page-day').scrollTop=scrollTo},100);
  }
}

// EXPENSE
function renderExp(){
  const list=document.getElementById('expList'),summary=document.getElementById('expSummary');
  if(!S.expenses.length){summary.innerHTML='<div class="exp-stat"><div class="exp-val">₹0</div><div class="exp-lbl">Aaj</div></div><div class="exp-stat"><div class="exp-val">₹0</div><div class="exp-lbl">Hafte</div></div>';list.innerHTML='<div class="empty-state"><div class="empty-icon">💸</div>Koi expense nahi<br>Log mein ₹ amount likho</div>';return}
  const today=new Date().toISOString().split('T')[0],week=Date.now()-7*86400000;
  const tAmt=S.expenses.filter(e=>e.time.startsWith(today)).reduce((s,e)=>s+e.amount,0);
  const wAmt=S.expenses.filter(e=>new Date(e.time)>week).reduce((s,e)=>s+e.amount,0);
  const total=S.expenses.reduce((s,e)=>s+e.amount,0);
  summary.innerHTML=`<div class="exp-stat"><div class="exp-val">₹${tAmt}</div><div class="exp-lbl">Aaj</div></div><div class="exp-stat"><div class="exp-val">₹${wAmt}</div><div class="exp-lbl">Hafte</div></div><div class="exp-stat"><div class="exp-val">${S.expenses.length}</div><div class="exp-lbl">Entries</div></div><div class="exp-stat"><div class="exp-val">₹${total}</div><div class="exp-lbl">Total</div></div>`;
  list.innerHTML=S.expenses.map(e=>{const t=new Date(e.time).toLocaleDateString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',hour12:true});return`<div class="exp-item"><div><div class="exp-desc">${e.text}</div><div class="exp-date">${t}</div><span class="exp-cat">${e.category}</span></div><div class="exp-amt">₹${e.amount}</div></div>`}).join('');
}

// MISTAKES
function addMistake(){const inp=document.getElementById('mInput');const t=inp.value.trim();if(!t)return;S.mistakes.unshift({id:Date.now(),text:t,time:new Date().toISOString()});save();inp.value='';renderMist();showToast('Mistake record! 📝')}
function delMist(id){S.mistakes=S.mistakes.filter(m=>m.id!==id);save();renderMist()}
function renderMist(){const l=document.getElementById('mList');if(!S.mistakes.length){l.innerHTML='<div class="empty-state"><div class="empty-icon">✨</div>Koi mistake nahi</div>';return}l.innerHTML=S.mistakes.map(m=>{const t=new Date(m.time).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'});return`<div class="m-item"><button class="m-del" onclick="delMist(${m.id})">✕</button><div class="m-date">${t}</div><div class="m-text">${m.text}</div></div>`}).join('')}

// ANALYSIS
async function runAnalysis(){
  if(!S.apiKey){showToast('API Key daalo ⚙️');openSettings();return}
  const from=new Date(document.getElementById('dFrom').value),to=new Date(document.getElementById('dTo').value);to.setHours(23,59,59);
  const logs=S.logs.filter(l=>new Date(l.startTime||l.time)>=from&&new Date(l.startTime||l.time)<=to);
  const exps=S.expenses.filter(e=>new Date(e.time)>=from&&new Date(e.time)<=to);
  const mist=S.mistakes.filter(m=>new Date(m.time)>=from&&new Date(m.time)<=to);
  if(!logs.length&&!exps.length&&!mist.length){document.getElementById('aiOut').innerHTML='<div class="empty-state"><div class="empty-icon">📊</div>Koi data nahi is period mein</div>';return}
  const btn=document.getElementById('aiBtn');btn.disabled=true;btn.innerHTML='<span class="dots"><span></span><span></span><span></span></span> Analyzing...';
  document.getElementById('aiOut').innerHTML='<div style="text-align:center;padding:30px;color:var(--muted)"><span class="dots"><span></span><span></span><span></span></span><p style="margin-top:14px;font-size:13px">AI tera data padh raha hai...</p></div>';
  const data=`ACTIVITIES:\n${logs.filter(l=>l.type==='activity').map(l=>`[${new Date(l.startTime).toLocaleString('en-IN')}] ${l.display} — ${l.duration}`).join('\n')}\n\nEXPENSES:\n${exps.map(e=>`[${new Date(e.time).toLocaleDateString('en-IN')}] ₹${e.amount} — ${e.text}`).join('\n')}\nTotal: ₹${exps.reduce((s,e)=>s+e.amount,0)}\n\nMISTAKES:\n${mist.map(m=>`[${new Date(m.time).toLocaleDateString('en-IN')}] ${m.text}`).join('\n')}`;
  try{
    const analysisPrompt=`Analyze ${S.userName||'my'} life data in Hinglish. Be specific and insightful.\n\n${data}\n\nProvide:\n1. 📊 PATTERNS\n2. ⏰ TIME ANALYSIS\n3. 💸 EXPENSE PATTERNS\n4. ❌ MISTAKE PATTERNS\n5. 💡 TOP 3 INSIGHTS\n6. 🎯 3 ACTIONABLE SUGGESTIONS`;
    const raw = await callAI(analysisPrompt, 1500);
    if(!raw) throw new Error('No response from AI');
    let res=raw.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/^##?\s(.+)$/gm,'<h3>$1</h3>').replace(/\n\n/g,'</p><p>');
    document.getElementById('aiOut').innerHTML=`<div class="ai-result"><p>${res}</p></div>`;
  }catch(e){document.getElementById('aiOut').innerHTML=`<div class="empty-state"><div class="empty-icon">⚠️</div>${e.message}</div>`}
  btn.disabled=false;btn.innerHTML='🔍 AI SE ANALYSIS KARO';
}

// CHARTS
function initCharts(){
  const labels=[],acts=[],exps=[];
  for(let i=13;i>=0;i--){
    const d=new Date(Date.now()-i*86400000),ds=d.toISOString().split('T')[0];
    labels.push(d.toLocaleDateString('en-IN',{day:'numeric',month:'short'}));
    acts.push(S.logs.filter(l=>(l.startTime||l.time||'').startsWith(ds)).length);
    exps.push(S.expenses.filter(e=>e.time.startsWith(ds)).reduce((s,e)=>s+e.amount,0));
  }
  const co={responsive:true,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#7a7060',font:{size:9}},grid:{color:'#3a3530'}},y:{ticks:{color:'#7a7060',font:{size:9}},grid:{color:'#3a3530'}}}};
  if(charts.a)charts.a.destroy();
  charts.a=new Chart(document.getElementById('actChart').getContext('2d'),{type:'bar',data:{labels,datasets:[{data:acts,backgroundColor:'rgba(212,168,67,0.4)',borderColor:'rgba(212,168,67,0.9)',borderWidth:1,borderRadius:4}]},options:co});
  if(charts.e)charts.e.destroy();
  charts.e=new Chart(document.getElementById('expChart').getContext('2d'),{type:'line',data:{labels,datasets:[{data:exps,borderColor:'rgba(224,122,58,0.9)',backgroundColor:'rgba(224,122,58,0.1)',fill:true,tension:0.4,pointBackgroundColor:'rgba(224,122,58,0.9)',pointRadius:3}]},options:co});
}

// FOOD FALLBACK (only when no API key)
function fallbackNutrition(text){
  const isSupp=/tablet|capsule|pill|powder|syrup|drops/i.test(text);
  return{type:isSupp?'supplement':'meal',name:text.slice(0,40),calories:0,protein:0,carbs:0,fat:0,fiber:0,notes:'API nahi hai — manually add karo'};
}
async function addFood(){
  const inp=document.getElementById('foodInput');
  const text=inp.value.trim();
  if(!text)return;
  const btn=document.getElementById('foodBtn');
  btn.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';
  btn.disabled=true;
  inp.value=''; inp.style.height='auto';
  const now=new Date();

  let parsed=null;
  if(S.apiKey){
    try{
      const prompt=`You are a nutrition expert. Analyze this food/supplement entry and return ONLY valid JSON.

Entry: "${text}"

Your job:
1. Identify what this is - food, drink, supplement, medicine, nootropic, etc
2. Calculate accurate macros and micros
3. If it's a pill/tablet/capsule/nootropic/medicine → type = "supplement"
4. If it's actual food/drink → type = "meal"

Return JSON:
{
  "type": "meal" or "supplement",
  "name": "proper clean name",
  "calories": accurate number,
  "protein": grams,
  "carbs": grams,
  "fat": grams,
  "fiber": grams,
  "notes": "any relevant info like serving size, brand, etc"
}

Be accurate. Use standard nutritional databases. For supplements like nootropics, vitamins, minerals, stimulants → calories should be 0 or near 0.`;

      const raw = await callAI(prompt, 500);
      if(raw){
        const m=raw.match(/\{[\s\S]*\}/);
        if(m){
          try{ parsed=JSON.parse(m[0]); }
          catch(e){ showToast('Parse error — retry karo'); }
        }
      }
    }catch(e){ showToast('API Error: '+e.message.slice(0,50)); }
  }

  if(!parsed) parsed=fallbackNutrition(text);

  const entry={id:Date.now(),type:parsed.type||'meal',name:parsed.name||text,raw:text,calories:Math.round(parsed.calories||0),protein:Math.round(parsed.protein||0),carbs:Math.round(parsed.carbs||0),fat:Math.round(parsed.fat||0),fiber:Math.round(parsed.fiber||0),notes:parsed.notes||'',time:now.toISOString()};
  S.foods.unshift(entry);
  save();
  btn.innerHTML='+'; btn.disabled=false;
  renderFood();
  showToast(entry.type==='supplement'?'💊 Supplement logged!':'🥗 ~'+entry.calories+' kcal logged!');
}

function renderFood(){
  const today=localDateStr(new Date());
  const todayFoods=S.foods.filter(f=>localDateStr(new Date(f.time))===today);
  const totalCal=todayFoods.reduce((s,f)=>s+f.calories,0);
  const totalProt=todayFoods.reduce((s,f)=>s+f.protein,0);
  const totalCarb=todayFoods.reduce((s,f)=>s+f.carbs,0);
  const suppCnt=todayFoods.filter(f=>f.type==='supplement').length;
  const goal=S.calorieGoal||2000;
  const pct=Math.min(100,(totalCal/goal)*100);

  document.getElementById('calCount').textContent=`${totalCal} / ${goal} kcal`;
  const fill=document.getElementById('calFill');
  fill.style.width=pct+'%';
  fill.className='cal-bar-fill'+(totalCal>goal?' over':'');
  document.getElementById('protTotal').textContent=totalProt+'g';
  document.getElementById('carbTotal').textContent=totalCarb+'g';
  document.getElementById('suppCount').textContent=suppCnt;

  const list=document.getElementById('foodList');
  if(!todayFoods.length){
    list.innerHTML='<div class="empty-state"><div class="empty-icon">🥗</div>Aaj kuch nahi khaya abhi<br>Upar likho kya khaya...</div>';
    return;
  }
  list.innerHTML=todayFoods.map(f=>{
    const t=new Date(f.time).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true});
    return`<div class="food-card ${f.type}-card">
      <button class="food-del" onclick="delFood(${f.id})">🗑</button>
      <div class="food-card-time">${t} <span class="food-tag ${f.type}">${f.type==='supplement'?'SUPPLEMENT':'MEAL'}</span></div>
      <div class="food-card-name">${f.name}</div>
      ${f.raw!==f.name?`<div class="food-card-raw">${f.raw}</div>`:''}
      <div class="food-macros">
        ${f.calories?`<span class="food-macro cal">🔥 ${f.calories} kcal</span>`:''}
        ${f.protein?`<span class="food-macro pro">💪 ${f.protein}g protein</span>`:''}
        ${f.carbs?`<span class="food-macro carb">🌾 ${f.carbs}g carbs</span>`:''}
        ${f.fat?`<span class="food-macro" style="background:rgba(224,122,58,0.15);color:var(--accent2)">🧈 ${f.fat}g fat</span>`:''}
        ${f.fiber?`<span class="food-macro" style="background:rgba(90,154,106,0.1);color:var(--green)">🌿 ${f.fiber}g fiber</span>`:''}
      </div>
    </div>`;
  }).join('');
}

function delFood(id){if(!confirm('Delete?'))return;S.foods=S.foods.filter(f=>f.id!==id);save();renderFood()}

// DOWNLOAD
function dlCSV(){
  let csv='Type,Date,Time,Activity,Duration,Amount,Category,Mood\n';
  S.logs.forEach(l=>{
    if(l.type==='activity'){const d=new Date(l.startTime);csv+=`Activity,${d.toLocaleDateString('en-IN')},${d.toLocaleTimeString('en-IN')},"${l.display}","${l.duration}",,,${l.mood}\n`}
    else if(l.type==='expense'){const d=new Date(l.time);csv+=`Expense,${d.toLocaleDateString('en-IN')},${d.toLocaleTimeString('en-IN')},,,"${l.amount}","${l.category}",${l.mood}\n`}
    else{const d=new Date(l.time||l.startTime);csv+=`Note,${d.toLocaleDateString('en-IN')},${d.toLocaleTimeString('en-IN')},,,,,"${(l.text||l.display||'').replace(/"/g,'""')}"\n`}
  });
  // Food section
  if(S.foods.length){
    csv+='\n\nFOOD LOG\nType,Date,Time,Food Name,Calories,Protein(g),Carbs(g),Fat(g),Raw Entry\n';
    S.foods.forEach(f=>{
      const d=new Date(f.time);
      csv+=`${f.type==='supplement'?'Supplement':'Meal'},${d.toLocaleDateString('en-IN')},${d.toLocaleTimeString('en-IN')},"${f.name}",${f.calories},${f.protein},${f.carbs},${f.fat||0},"${f.raw.replace(/"/g,'""')}"\n`;
    });
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`life-${new Date().toISOString().split('T')[0]}.csv`;a.click();
  showToast('CSV download! ✅');
}

// SETTINGS
async function testAPI(){
  const key=document.getElementById('apiInput').value.trim()||S.apiKey;
  if(!key){document.getElementById('testResult').style.display='block';document.getElementById('testResult').style.background='rgba(192,57,43,0.15)';document.getElementById('testResult').style.color='var(--danger)';document.getElementById('testResult').textContent='❌ API Key nahi hai! Pehle key daalo.';return}
  const btn=document.getElementById('testBtn');
  btn.textContent='Testing...'; btn.disabled=true;
  const res=document.getElementById('testResult');
  res.style.display='block';
  res.style.background='rgba(212,168,67,0.1)';
  res.style.color='var(--accent)';
  res.textContent='🔄 API call ho rahi hai...';
  try{
    const url=`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-lite:generateContent?key=${key}`;
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:'Reply with just: WORKING'}]}],generationConfig:{maxOutputTokens:10}})});
    const d=await r.json();
    if(d.error){
      res.style.background='rgba(192,57,43,0.15)';res.style.color='var(--danger)';
      res.textContent='❌ Error: '+d.error.message;
    } else {
      const reply=d.candidates?.[0]?.content?.parts?.[0]?.text||'OK';
      res.style.background='rgba(90,154,106,0.15)';res.style.color='var(--green)';
      res.textContent='✅ Gemini API sahi kaam kar rahi hai! Response: '+reply;
    }
  }catch(e){
    res.style.background='rgba(192,57,43,0.15)';res.style.color='var(--danger)';
    res.textContent='❌ Network Error: '+e.message;
  }
  btn.textContent='🔌 API TEST KARO'; btn.disabled=false;
}

function openSettings(){document.getElementById('apiInput').value=S.apiKey;document.getElementById('nameInput').value=S.userName;document.getElementById('calGoalInput').value=S.calorieGoal||2000;renderScM();document.getElementById('settingsModal').classList.add('open')}
function closeOvr(e){if(e.target.id==='settingsModal')document.getElementById('settingsModal').classList.remove('open')}
function saveSettings(){S.apiKey=document.getElementById('apiInput').value.trim();S.userName=document.getElementById('nameInput').value.trim();S.calorieGoal=parseInt(document.getElementById('calGoalInput').value)||2000;save();document.getElementById('settingsModal').classList.remove('open');showToast('Settings save! ✅')}
function clearAll(){if(confirm('Pakka? Saara data delete?')){S.logs=[];S.expenses=[];S.mistakes=[];S.running=null;S.foods=[];save();renderAll();document.getElementById('settingsModal').classList.remove('open');showToast('Data clear ho gaya')}}

document.getElementById('logInput').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'});

init();
