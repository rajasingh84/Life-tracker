<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0e0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>Life Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg: #0f0e0c;
    --bg2: #1a1814;
    --bg3: #242018;
    --surface: #2a2520;
    --border: #3a3530;
    --text: #e8e0d0;
    --muted: #8a8070;
    --accent: #d4a843;
    --accent2: #e07a3a;
    --danger: #c0392b;
    --green: #5a9a6a;
    --blue: #4a7fa0;
    --radius: 14px;
    --tab-h: 60px;
    --header-h: 56px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; }

  /* HEADER */
  .header {
    height: var(--header-h);
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 16px;
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
  }
  .header-title {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 18px;
    color: var(--accent);
    letter-spacing: -0.5px;
  }
  .header-title span { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 6px; }
  .settings-btn {
    width: 36px; height: 36px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .settings-btn:hover { color: var(--accent); border-color: var(--accent); }

  /* TABS */
  .tabs {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: var(--tab-h);
    background: var(--bg2);
    border-top: 1px solid var(--border);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    z-index: 100;
  }
  .tab-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-family: 'Syne', sans-serif;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    transition: color 0.2s;
    position: relative;
  }
  .tab-btn.active { color: var(--accent); }
  .tab-btn .tab-icon { font-size: 20px; }
  .tab-btn::after {
    content: '';
    position: absolute;
    bottom: 0; left: 20%; right: 20%;
    height: 2px;
    background: var(--accent);
    border-radius: 2px 2px 0 0;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .tab-btn.active::after { opacity: 1; }

  /* PAGES */
  .page {
    position: fixed;
    top: var(--header-h); left: 0; right: 0;
    bottom: var(--tab-h);
    overflow-y: auto;
    overflow-x: hidden;
    display: none;
    -webkit-overflow-scrolling: touch;
  }
  .page.active { display: block; }

  /* ===== LOG PAGE ===== */
  .shortcuts-bar {
    padding: 10px 12px 6px;
    display: flex;
    gap: 6px;
    flex-wrap: nowrap;
    overflow-x: auto;
    scrollbar-width: none;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .shortcuts-bar::-webkit-scrollbar { display: none; }
  .shortcut-chip {
    flex-shrink: 0;
    padding: 5px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 11px;
    font-family: 'DM Mono', monospace;
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .shortcut-chip:active { background: var(--accent); color: var(--bg); border-color: var(--accent); transform: scale(0.95); }
  .shortcut-add-btn {
    flex-shrink: 0;
    width: 30px; height: 28px;
    background: none;
    border: 1px dashed var(--border);
    border-radius: 20px;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }

  /* LOG FEED */
  .log-feed {
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 200px;
  }
  .log-entry {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    position: relative;
  }
  .log-entry.sleep-entry { border-left: 3px solid var(--blue); }
  .log-entry.expense-entry { border-left: 3px solid var(--green); }
  .log-entry-time {
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 4px;
    font-family: 'DM Mono', monospace;
  }
  .log-entry-text {
    font-size: 13px;
    line-height: 1.5;
    color: var(--text);
  }
  .log-entry-tag {
    display: inline-block;
    margin-top: 5px;
    padding: 2px 7px;
    border-radius: 10px;
    font-size: 10px;
    background: var(--surface);
    color: var(--muted);
  }
  .log-entry-delete {
    position: absolute;
    top: 8px; right: 8px;
    background: none;
    border: none;
    color: var(--border);
    font-size: 14px;
    cursor: pointer;
    padding: 2px 5px;
  }
  .log-entry-delete:active { color: var(--danger); }
  .calc-badge {
    margin-top: 5px;
    display: inline-block;
    padding: 2px 8px;
    border-radius: 8px;
    font-size: 11px;
    background: rgba(74, 127, 160, 0.2);
    color: var(--blue);
    font-family: 'DM Mono', monospace;
  }

  /* DATE SEPARATOR */
  .date-sep {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    padding: 8px 0 4px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* INPUT AREA */
  .input-area {
    position: sticky;
    bottom: 0;
    background: var(--bg);
    border-top: 1px solid var(--border);
    padding: 10px 12px;
  }
  .input-row {
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }
  .log-input {
    flex: 1;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    resize: none;
    outline: none;
    min-height: 42px;
    max-height: 120px;
    overflow-y: auto;
    transition: border-color 0.2s;
    line-height: 1.4;
  }
  .log-input:focus { border-color: var(--accent); }
  .log-input::placeholder { color: var(--muted); }
  .send-btn {
    width: 42px; height: 42px;
    background: var(--accent);
    border: none;
    border-radius: 12px;
    color: var(--bg);
    font-size: 18px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
    flex-shrink: 0;
  }
  .send-btn:active { transform: scale(0.92); background: var(--accent2); }

  /* MOOD PICKER */
  .mood-row {
    display: flex;
    gap: 6px;
    margin-bottom: 7px;
    align-items: center;
  }
  .mood-label { font-size: 10px; color: var(--muted); margin-right: 2px; }
  .mood-btn {
    width: 28px; height: 28px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    font-size: 14px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .mood-btn.selected { border-color: var(--accent); background: rgba(212, 168, 67, 0.15); }

  /* ===== EXPENSE PAGE ===== */
  .expense-summary {
    margin: 12px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .exp-stat { text-align: center; }
  .exp-stat-val {
    font-family: 'Syne', sans-serif;
    font-size: 22px;
    font-weight: 800;
    color: var(--accent);
  }
  .exp-stat-label { font-size: 10px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
  .expense-list { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 8px; }
  .expense-item {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .expense-item-left { flex: 1; }
  .expense-item-desc { font-size: 13px; color: var(--text); }
  .expense-item-date { font-size: 10px; color: var(--muted); margin-top: 2px; }
  .expense-item-amount {
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--accent2);
  }
  .expense-item-cat {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 8px;
    background: var(--surface);
    color: var(--muted);
    margin-top: 3px;
    display: inline-block;
  }
  .section-header {
    padding: 12px 12px 6px;
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.8;
  }
  .empty-state .empty-icon { font-size: 40px; margin-bottom: 10px; }

  /* ===== MISTAKE PAGE ===== */
  .mistake-input-area {
    padding: 12px;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .mistake-textarea {
    width: 100%;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    color: var(--text);
    font-family: 'Instrument Serif', serif;
    font-size: 15px;
    resize: none;
    outline: none;
    min-height: 80px;
    line-height: 1.6;
    transition: border-color 0.2s;
  }
  .mistake-textarea:focus { border-color: var(--danger); }
  .mistake-textarea::placeholder { color: var(--muted); font-style: italic; }
  .mistake-add-btn {
    margin-top: 8px;
    width: 100%;
    padding: 10px;
    background: rgba(192, 57, 43, 0.15);
    border: 1px solid rgba(192, 57, 43, 0.3);
    border-radius: var(--radius);
    color: var(--danger);
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: all 0.15s;
  }
  .mistake-add-btn:active { background: rgba(192, 57, 43, 0.3); transform: scale(0.98); }
  .mistake-list { padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .mistake-item {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--danger);
    border-radius: var(--radius);
    padding: 12px 14px;
    position: relative;
  }
  .mistake-item-date { font-size: 10px; color: var(--muted); margin-bottom: 5px; font-family: 'DM Mono', monospace; }
  .mistake-item-text { font-family: 'Instrument Serif', serif; font-size: 14px; line-height: 1.6; color: var(--text); }
  .mistake-del-btn {
    position: absolute; top: 8px; right: 8px;
    background: none; border: none; color: var(--border); font-size: 14px; cursor: pointer; padding: 3px 6px;
  }
  .mistake-del-btn:active { color: var(--danger); }

  /* ===== ANALYSIS PAGE ===== */
  .analysis-controls {
    padding: 12px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
  }
  .date-range-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 10px;
  }
  .date-input-wrap label {
    font-size: 10px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: block;
    margin-bottom: 4px;
  }
  .date-input-wrap input[type="date"] {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    outline: none;
  }
  .date-input-wrap input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.7); }
  .analyze-btn {
    width: 100%;
    padding: 12px;
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    color: var(--bg);
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: all 0.15s;
  }
  .analyze-btn:active { transform: scale(0.98); background: var(--accent2); }
  .analyze-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .analysis-result {
    padding: 12px;
    white-space: pre-wrap;
    font-size: 13px;
    line-height: 1.8;
    color: var(--text);
    font-family: 'DM Mono', monospace;
  }
  .analysis-result h3 {
    font-family: 'Syne', sans-serif;
    color: var(--accent);
    font-size: 15px;
    margin: 14px 0 6px;
  }
  .analysis-result strong { color: var(--accent2); font-weight: 500; }
  .chart-wrap {
    margin: 12px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
  }
  .chart-wrap h4 {
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 12px;
  }
  .download-row {
    padding: 12px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .dl-btn {
    padding: 12px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    transition: all 0.15s;
  }
  .dl-btn span:first-child { font-size: 20px; }
  .dl-btn:active { background: var(--accent); color: var(--bg); border-color: var(--accent); transform: scale(0.97); }
  .loading-dots {
    display: inline-flex;
    gap: 4px;
    align-items: center;
  }
  .loading-dots span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: dot-bounce 1.2s infinite;
  }
  .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dot-bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-6px); opacity: 1; }
  }

  /* ===== SETTINGS MODAL ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    z-index: 999;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal-sheet {
    background: var(--bg2);
    border-radius: 20px 20px 0 0;
    border: 1px solid var(--border);
    border-bottom: none;
    width: 100%;
    max-width: 500px;
    padding: 20px;
    max-height: 85vh;
    overflow-y: auto;
    animation: slide-up 0.3s ease;
  }
  @keyframes slide-up {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  .modal-handle {
    width: 40px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 16px;
  }
  .modal-title {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 16px;
  }
  .field-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
    margin-top: 14px;
    display: block;
  }
  .field-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    outline: none;
  }
  .field-input:focus { border-color: var(--accent); }
  .save-settings-btn {
    margin-top: 16px;
    width: 100%;
    padding: 12px;
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    color: var(--bg);
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
  }
  .shortcut-manage-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  .shortcut-manage-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: var(--surface);
    border-radius: 10px;
    font-size: 13px;
  }
  .shortcut-remove-btn {
    background: none; border: none; color: var(--muted); font-size: 16px; cursor: pointer;
  }
  .shortcut-remove-btn:active { color: var(--danger); }

  /* TOAST */
  .toast {
    position: fixed;
    top: calc(var(--header-h) + 10px);
    left: 50%;
    transform: translateX(-50%) translateY(-20px);
    background: var(--accent);
    color: var(--bg);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    opacity: 0;
    transition: all 0.3s;
    z-index: 9999;
    white-space: nowrap;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* STREAK ROW */
  .streak-row {
    padding: 10px 12px;
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    background: var(--bg2);
  }
  .streak-label { font-size: 11px; color: var(--muted); font-family: 'Syne', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
  .streak-dot {
    width: 18px; height: 18px;
    border-radius: 4px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 9px;
    display: flex; align-items: center; justify-content: center;
    color: var(--muted);
    title: '';
  }
  .streak-dot.has-log { background: rgba(212, 168, 67, 0.3); border-color: var(--accent); }

  /* Analysis loading */
  .analysis-loading {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
  }
  .analysis-loading p { margin-top: 16px; font-size: 13px; }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-title">LIFE<span id="currentDate"></span></div>
  <button class="settings-btn" onclick="openSettings()">⚙️</button>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- ============ LOG PAGE ============ -->
<div class="page active" id="page-log">
  <div class="shortcuts-bar" id="shortcutsBar"></div>
  <div class="streak-row" id="streakRow"></div>
  <div class="log-feed" id="logFeed"></div>
  <div class="input-area">
    <div class="mood-row">
      <span class="mood-label">MOOD:</span>
      <button class="mood-btn" data-mood="😴" onclick="selectMood(this)">😴</button>
      <button class="mood-btn" data-mood="😐" onclick="selectMood(this)">😐</button>
      <button class="mood-btn" data-mood="🙂" onclick="selectMood(this)">🙂</button>
      <button class="mood-btn" data-mood="😤" onclick="selectMood(this)">😤</button>
      <button class="mood-btn" data-mood="🔥" onclick="selectMood(this)">🔥</button>
    </div>
    <div class="input-row">
      <textarea class="log-input" id="logInput" placeholder="kya hua / sleeping start / sleeping end / 120 kharch hua..." rows="1"></textarea>
      <button class="send-btn" onclick="addLog()">↑</button>
    </div>
  </div>
</div>

<!-- ============ EXPENSE PAGE ============ -->
<div class="page" id="page-expense">
  <div class="expense-summary" id="expenseSummary"></div>
  <div class="section-header">EXPENSE LOG</div>
  <div class="expense-list" id="expenseList"></div>

    <h4>Expense Trend</h4>
    <canvas id="expenseChart" height="150"></canvas>

<!-- ============ TABS ============ -->
<div class="tabs">

  <button class="tab-btn" onclick="switchTab('expense', this)">
    <span class="tab-icon">💸</span>EXPENSE
  </button>
  <button class="tab-btn" onclick="switchTab('mistake', this)">
    <span class="tab-icon">❌</span>MISTAKE
  </button>
  <button class="tab-btn" onclick="switchTab('analysis', this)">
    <span class="tab-icon">📊</span>ANALYSIS
  </button>

<!-- ============ SETTINGS MODAL ============ -->
<div class="modal-overlay" id="settingsModal" onclick="closeSettingsOutside(event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title">⚙️ Settings</div>

    <label class="field-label">Anthropic API Key</label>
    <input type="password" class="field-input" id="apiKeyInput" placeholder="sk-ant-...">
    <div style="font-size:11px;color:var(--muted);margin-top:5px;">console.anthropic.com se lao → API Keys</div>

    <label class="field-label">Aapka Naam</label>
    <input type="text" class="field-input" id="userNameInput" placeholder="Jaise: Rajanish">

    <button class="save-settings-btn" onclick="saveSettings()">💾 SAVE KARO</button>

    <div style="margin-top:20px;">
      <label class="field-label">SHORTCUTS MANAGE KARO</label>
      <div class="shortcut-manage-list" id="shortcutManageList"></div>
      <div style="display:flex;gap:8px;margin-top:8px;">
        <input type="text" class="field-input" id="newShortcutInput" placeholder="Nayi shortcut likho..." style="flex:1">
        <button onclick="addShortcut()" style="padding:8px 14px;background:var(--accent);border:none;border-radius:10px;color:var(--bg);font-family:'Syne',sans-serif;font-weight:700;cursor:pointer;">+</button>
      </div>
    </div>

    <div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--border);">
      <button onclick="clearAllData()" style="width:100%;padding:10px;background:rgba(192,57,43,0.15);border:1px solid rgba(192,57,43,0.3);border-radius:10px;color:var(--danger);font-family:'Syne',sans-serif;font-size:12px;font-weight:700;cursor:pointer;">⚠️ SAARA DATA DELETE KARO</button>
    </div>
  </div>
</div>

<script>
// ============ STATE ============
let state = {
  logs: [],
  expenses: [],
  mistakes: [],
  shortcuts: ['chai ☕', 'gym 💪', 'study 📚', 'trading 📈', 'walk 🚶'],
  apiKey: '',
  userName: '',
  selectedMood: ''
};

// ============ INIT ============
function init() {
  const saved = localStorage.getItem('lifetracker_v2');
  if (saved) state = { ...state, ...JSON.parse(saved) };

  // Set header date
  document.getElementById('currentDate').textContent = ' · ' + new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });

  // Set default date range
  const today = new Date().toISOString().split('T')[0];
  const week = new Date(Date.now() - 7 * 86400000).toISOString().split('T')[0];
  document.getElementById('dateFrom').value = week;
  document.getElementById('dateTo').value = today;

  renderShortcuts();
  renderLogFeed();
  renderExpense();
  renderMistakes();
  renderStreak();
  initCharts();
}

// ============ SAVE ============
function save() {
  localStorage.setItem('lifetracker_v2', JSON.stringify(state));
}

// ============ TABS ============
function switchTab(name, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  btn.classList.add('active');
  if (name === 'analysis') { initCharts(); }
}

// ============ MOOD ============
function selectMood(btn) {
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  state.selectedMood = btn.dataset.mood;
}

// ============ SHORTCUTS ============
function renderShortcuts() {
  const bar = document.getElementById('shortcutsBar');
  bar.innerHTML = '';
  state.shortcuts.forEach(s => {
    const chip = document.createElement('button');
    chip.className = 'shortcut-chip';
    chip.textContent = s;
    chip.onclick = () => useShortcut(s);
    bar.appendChild(chip);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'shortcut-add-btn';
  addBtn.textContent = '+';
  addBtn.onclick = openSettings;
  bar.appendChild(addBtn);
}

function useShortcut(text) {
  const inp = document.getElementById('logInput');
  inp.value = text;
  inp.focus();
}

function addShortcut() {
  const val = document.getElementById('newShortcutInput').value.trim();
  if (!val) return;
  state.shortcuts.push(val);
  document.getElementById('newShortcutInput').value = '';
  save();
  renderShortcuts();
  renderShortcutManage();
  showToast('Shortcut add ho gaya! ✅');
}

function removeShortcut(idx) {
  state.shortcuts.splice(idx, 1);
  save();
  renderShortcuts();
  renderShortcutManage();
}

function renderShortcutManage() {
  const list = document.getElementById('shortcutManageList');
  list.innerHTML = '';
  state.shortcuts.forEach((s, i) => {
    const div = document.createElement('div');
    div.className = 'shortcut-manage-item';
    div.innerHTML = `<span>${s}</span><button class="shortcut-remove-btn" onclick="removeShortcut(${i})">✕</button>`;
    list.appendChild(div);
  });
}

// ============ LOG ============
function addLog() {
  const inp = document.getElementById('logInput');
  const text = inp.value.trim();
  if (!text) return;

  const now = new Date();
  const entry = {
    id: Date.now(),
    text: text,
    time: now.toISOString(),
    mood: state.selectedMood || '',
    type: 'log'
  };

  // Detect sleep patterns
  const lowerText = text.toLowerCase();
  if (lowerText.includes('sleeping end') || lowerText.includes('sleep end') || lowerText.includes('uthh') || lowerText.includes('woke up') || lowerText.includes('good morning')) {
    const sleepStart = state.logs.slice().reverse().find(l =>
      l.text.toLowerCase().includes('sleeping start') || l.text.toLowerCase().includes('sleep start') || l.text.toLowerCase().includes('so raha') || l.text.toLowerCase().includes('sone ja')
    );
    if (sleepStart) {
      const diff = now - new Date(sleepStart.time);
      const hours = Math.floor(diff / 3600000);
      const mins = Math.floor((diff % 3600000) / 60000);
      entry.sleepCalc = `Neend: ${hours}h ${mins}m`;
      entry.type = 'sleep';
    }
  }

  // Detect expense
  const expenseMatch = text.match(/(?:₹|rs\.?|rupees?|kharch|spend|spent|paid|diya)\s*(\d+(?:\.\d+)?)|(\d+(?:\.\d+)?)\s*(?:₹|rs\.?|rupees?|kharch|spend|spent|paid|ka|ki)/i);
  if (expenseMatch) {
    const amount = parseFloat(expenseMatch[1] || expenseMatch[2]);
    if (amount > 0) {
      entry.type = 'expense';
      const expEntry = {
        id: entry.id,
        text: text,
        amount: amount,
        time: now.toISOString(),
        category: detectCategory(text)
      };
      state.expenses.unshift(expEntry);
    }
  }

  state.logs.unshift(entry);
  save();
  inp.value = '';
  inp.style.height = 'auto';

  // Reset mood
  document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('selected'));
  state.selectedMood = '';

  renderLogFeed();
  renderExpense();
  renderStreak();
  showToast('Logged! ✅');
}

function detectCategory(text) {
  const t = text.toLowerCase();
  if (t.match(/food|khana|pizza|burger|chai|coffee|restaurant|bhojan|lunch|dinner|breakfast/)) return '🍔 Food';
  if (t.match(/auto|uber|ola|petrol|bus|train|travel|yatra/)) return '🚗 Travel';
  if (t.match(/book|course|study|padhai/)) return '📚 Study';
  if (t.match(/medicine|dawai|doctor|hospital/)) return '💊 Health';
  return '📦 Other';
}

function deleteLog(id) {
  state.logs = state.logs.filter(l => l.id !== id);
  // also remove from expenses if it was an expense
  state.expenses = state.expenses.filter(e => e.id !== id);
  save();
  renderLogFeed();
  renderExpense();
}

function renderLogFeed() {
  const feed = document.getElementById('logFeed');
  if (state.logs.length === 0) {
    feed.innerHTML = `<div class="empty-state"><div class="empty-icon">📝</div>Koi log nahi abhi<br>Kuch bhi likho neeche...</div>`;
    return;
  }

  const grouped = {};
  state.logs.forEach(l => {
    const d = new Date(l.time).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    if (!grouped[d]) grouped[d] = [];
    grouped[d].push(l);
  });

  let html = '';
  Object.entries(grouped).forEach(([date, entries]) => {
    html += `<div class="date-sep">${date}</div>`;
    entries.forEach(e => {
      const t = new Date(e.time).toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', hour12: true });
      html += `<div class="log-entry ${e.type === 'sleep' ? 'sleep-entry' : ''} ${e.type === 'expense' ? 'expense-entry' : ''}">
        <button class="log-entry-delete" onclick="deleteLog(${e.id})">✕</button>
        <div class="log-entry-time">${t}</div>
        <div class="log-entry-text">${e.text}</div>
        ${e.mood ? `<span class="log-entry-tag">${e.mood}</span>` : ''}
        ${e.sleepCalc ? `<div class="calc-badge">⏱ ${e.sleepCalc}</div>` : ''}
      </div>`;
    });
  });

  feed.innerHTML = html;
  feed.scrollTop = 0;
}

// ============ STREAK ============
function renderStreak() {
  const row = document.getElementById('streakRow');
  const days = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date(Date.now() - i * 86400000);
    const dStr = d.toISOString().split('T')[0];
    const hasLog = state.logs.some(l => l.time.startsWith(dStr));
    days.push({ d, hasLog });
  }
  row.innerHTML = `<span class="streak-label">14D</span>` + days.map(({ d, hasLog }) =>
    `<div class="streak-dot ${hasLog ? 'has-log' : ''}" title="${d.toDateString()}">${hasLog ? '●' : '·'}</div>`
  ).join('');
}

// ============ EXPENSE ============
function renderExpense() {
  const list = document.getElementById('expenseList');
  const summary = document.getElementById('expenseSummary');

  if (state.expenses.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">💸</div>Koi expense nahi<br>Log mein ₹ amount likho auto-detect hoga</div>`;
    summary.innerHTML = `<div class="exp-stat"><div class="exp-stat-val">₹0</div><div class="exp-stat-label">Aaj</div></div><div class="exp-stat"><div class="exp-stat-val">₹0</div><div class="exp-stat-label">Is hafte</div></div>`;
    return;
  }

  const today = new Date().toISOString().split('T')[0];
  const week = Date.now() - 7 * 86400000;
  const todayTotal = state.expenses.filter(e => e.time.startsWith(today)).reduce((s, e) => s + e.amount, 0);
  const weekTotal = state.expenses.filter(e => new Date(e.time) > week).reduce((s, e) => s + e.amount, 0);

  summary.innerHTML = `
    <div class="exp-stat"><div class="exp-stat-val">₹${todayTotal}</div><div class="exp-stat-label">Aaj</div></div>
    <div class="exp-stat"><div class="exp-stat-val">₹${weekTotal}</div><div class="exp-stat-label">Is Hafte</div></div>
    <div class="exp-stat"><div class="exp-stat-val">${state.expenses.length}</div><div class="exp-stat-label">Total Entries</div></div>
    <div class="exp-stat"><div class="exp-stat-val">₹${state.expenses.reduce((s, e) => s + e.amount, 0)}</div><div class="exp-stat-label">Total Ever</div></div>
  `;

  list.innerHTML = state.expenses.map(e => {
    const t = new Date(e.time).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit', hour12: true });
    return `<div class="expense-item">
      <div class="expense-item-left">
        <div class="expense-item-desc">${e.text}</div>
        <div class="expense-item-date">${t}</div>
        <span class="expense-item-cat">${e.category}</span>
      </div>
      <div class="expense-item-amount">₹${e.amount}</div>
    </div>`;
  }).join('');
}

// ============ MISTAKES ============
function addMistake() {
  const inp = document.getElementById('mistakeInput');
  const text = inp.value.trim();
  if (!text) return;
  state.mistakes.unshift({ id: Date.now(), text, time: new Date().toISOString() });
  save();
  inp.value = '';
  renderMistakes();
  showToast('Mistake record ho gaya 📝');
}

function deleteMistake(id) {
  state.mistakes = state.mistakes.filter(m => m.id !== id);
  save();
  renderMistakes();
}

function renderMistakes() {
  const list = document.getElementById('mistakeList');
  if (state.mistakes.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="empty-icon">✨</div>Koi mistake nahi record hui<br>Seekhne ka mauka har din hota hai</div>`;
    return;
  }
  list.innerHTML = state.mistakes.map(m => {
    const t = new Date(m.time).toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
    return `<div class="mistake-item">
      <button class="mistake-del-btn" onclick="deleteMistake(${m.id})">✕</button>
      <div class="mistake-item-date">${t}</div>
      <div class="mistake-item-text">${m.text}</div>
    </div>`;
  }).join('');
}

// ============ ANALYSIS ============
async function runAnalysis() {
  const apiKey = state.apiKey;
  if (!apiKey) {
    showToast('Pehle Settings mein API Key daalo ⚙️');
    openSettings();
    return;
  }

  const from = document.getElementById('dateFrom').value;
  const to = document.getElementById('dateTo').value;
  const fromDate = new Date(from);
  const toDate = new Date(to);
  toDate.setHours(23, 59, 59);

  const filteredLogs = state.logs.filter(l => {
    const d = new Date(l.time);
    return d >= fromDate && d <= toDate;
  });
  const filteredExpenses = state.expenses.filter(e => {
    const d = new Date(e.time);
    return d >= fromDate && d <= toDate;
  });
  const filteredMistakes = state.mistakes.filter(m => {
    const d = new Date(m.time);
    return d >= fromDate && d <= toDate;
  });

  if (filteredLogs.length === 0 && filteredExpenses.length === 0 && filteredMistakes.length === 0) {
    document.getElementById('analysisOutput').innerHTML = `<div class="empty-state"><div class="empty-icon">📊</div>Is period mein koi data nahi</div>`;
    return;
  }

  const btn = document.getElementById('analyzeBtn');
  btn.disabled = true;
  btn.innerHTML = `<span class="loading-dots"><span></span><span></span><span></span></span> Analyze ho raha hai...`;

  document.getElementById('analysisOutput').innerHTML = `<div class="analysis-loading"><div class="loading-dots"><span></span><span></span><span></span></div><p>AI tera data padh raha hai...</p></div>`;

  const dataStr = `
LOGS (${from} to ${to}):
${filteredLogs.map(l => `[${new Date(l.time).toLocaleString('en-IN')}] ${l.mood ? l.mood + ' ' : ''}${l.text}${l.sleepCalc ? ' | ' + l.sleepCalc : ''}`).join('\n')}

EXPENSES:
${filteredExpenses.map(e => `[${new Date(e.time).toLocaleDateString('en-IN')}] ₹${e.amount} - ${e.text} (${e.category})`).join('\n')}
Total Expenses: ₹${filteredExpenses.reduce((s, e) => s + e.amount, 0)}

MISTAKES:
${filteredMistakes.map(m => `[${new Date(m.time).toLocaleDateString('en-IN')}] ${m.text}`).join('\n')}
`;

  const prompt = `You are analyzing the personal life data of ${state.userName || 'the user'}. Please analyze this data and provide insights in Hinglish (Hindi + English mix).

DATA:
${dataStr}

Please provide:
1. 📊 PATTERNS - Kya patterns dikh rahe hain? (time, behavior, habits)
2. 😴 SLEEP ANALYSIS - Neend ke patterns kya hain?
3. 💸 EXPENSE PATTERNS - Paise kahan ja rahe hain?
4. ❌ MISTAKE PATTERNS - Galtiyan repeat ho rahi hain kya?
5. 💡 KEY INSIGHTS - 3 sabse important observations
6. 🎯 SUGGESTIONS - 3 actionable improvements

Be specific, use the actual data points, be honest and direct. Write in a friendly but analytical tone.`;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1500,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    const data = await response.json();
    if (data.error) throw new Error(data.error.message);

    const result = data.content[0].text;
    // Format output
    let formatted = result
      .replace(/\n\n/g, '</p><p>')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/^##\s(.+)$/gm, '<h3>$1</h3>')
      .replace(/^#\s(.+)$/gm, '<h3>$1</h3>');

    document.getElementById('analysisOutput').innerHTML = `<div class="analysis-result"><p>${formatted}</p></div>`;

  } catch (err) {
    document.getElementById('analysisOutput').innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div>Error: ${err.message}<br><br>API Key check karo Settings mein</div>`;
  }

  btn.disabled = false;
  btn.innerHTML = '🔍 AI SE ANALYSIS KARO';
}

// ============ CHARTS ============
let charts = {};
function initCharts() {
  // Activity chart — last 14 days
  const labels = [];
  const data = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date(Date.now() - i * 86400000);
    const dStr = d.toISOString().split('T')[0];
    labels.push(d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }));
    data.push(state.logs.filter(l => l.time.startsWith(dStr)).length);
  }

  const actCtx = document.getElementById('activityChart').getContext('2d');
  if (charts.activity) charts.activity.destroy();
  charts.activity = new Chart(actCtx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data,
        backgroundColor: 'rgba(212, 168, 67, 0.4)',
        borderColor: 'rgba(212, 168, 67, 0.9)',
        borderWidth: 1,
        borderRadius: 4
      }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#8a8070', font: { size: 9 } }, grid: { color: '#3a3530' } },
        y: { ticks: { color: '#8a8070', font: { size: 9 } }, grid: { color: '#3a3530' } }
      }
    }
  });

  // Expense chart
  const expLabels = [];
  const expData = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date(Date.now() - i * 86400000);
    const dStr = d.toISOString().split('T')[0];
    expLabels.push(d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }));
    expData.push(state.expenses.filter(e => e.time.startsWith(dStr)).reduce((s, e) => s + e.amount, 0));
  }

  const expCtx = document.getElementById('expenseChart').getContext('2d');
  if (charts.expense) charts.expense.destroy();
  charts.expense = new Chart(expCtx, {
    type: 'line',
    data: {
      labels: expLabels,
      datasets: [{
        data: expData,
        borderColor: 'rgba(224, 122, 58, 0.9)',
        backgroundColor: 'rgba(224, 122, 58, 0.1)',
        fill: true,
        tension: 0.4,
        pointBackgroundColor: 'rgba(224, 122, 58, 0.9)',
        pointRadius: 3
      }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        x: { ticks: { color: '#8a8070', font: { size: 9 } }, grid: { color: '#3a3530' } },
        y: { ticks: { color: '#8a8070', font: { size: 9 } }, grid: { color: '#3a3530' } }
      }
    }
  });
}

// ============ DOWNLOAD ============
function downloadCSV() {
  let csv = 'Type,Date,Time,Text,Amount,Mood,Category\n';
  state.logs.forEach(l => {
    const d = new Date(l.time);
    csv += `Log,${d.toLocaleDateString('en-IN')},${d.toLocaleTimeString('en-IN')},"${l.text.replace(/"/g,'""')}",,"${l.mood}",\n`;
  });
  state.expenses.forEach(e => {
    const d = new Date(e.time);
    csv += `Expense,${d.toLocaleDateString('en-IN')},${d.toLocaleTimeString('en-IN')},"${e.text.replace(/"/g,'""')}",${e.amount},,"${e.category}"\n`;
  });
  state.mistakes.forEach(m => {
    const d = new Date(m.time);
    csv += `Mistake,${d.toLocaleDateString('en-IN')},${d.toLocaleTimeString('en-IN')},"${m.text.replace(/"/g,'""')}",,,\n`;
  });

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `life-tracker-${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
  showToast('CSV download ho raha hai ✅');
}

function downloadPDF() {
  window.print();
}

// ============ SETTINGS ============
function openSettings() {
  document.getElementById('apiKeyInput').value = state.apiKey;
  document.getElementById('userNameInput').value = state.userName;
  renderShortcutManage();
  document.getElementById('settingsModal').classList.add('open');
}

function closeSettingsOutside(e) {
  if (e.target === document.getElementById('settingsModal')) closeSettings();
}

function closeSettings() {
  document.getElementById('settingsModal').classList.remove('open');
}

function saveSettings() {
  state.apiKey = document.getElementById('apiKeyInput').value.trim();
  state.userName = document.getElementById('userNameInput').value.trim();
  save();
  closeSettings();
  showToast('Settings save ho gayi ✅');
}

function clearAllData() {
  if (confirm('Pakka? Saara data delete ho jaayega!')) {
    state.logs = [];
    state.expenses = [];
    state.mistakes = [];
    save();
    renderLogFeed();
    renderExpense();
    renderMistakes();
    renderStreak();
    closeSettings();
    showToast('Data clear ho gaya');
  }
}

// ============ TOAST ============
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// ============ INPUT AUTO RESIZE ============
document.getElementById('logInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// Enter to submit (Shift+Enter for newline)
document.getElementById('logInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    addLog();
  }
});

document.getElementById('mistakeInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && e.ctrlKey) addMistake();
});

// ============ START ============
init();
</script>
